<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BladeArtFight</title>
<style>
/* ============================================================
   BladeArtFight v2 - clean rewrite
   styles + screens with smooth transitions
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  background: #dfe4ea;
  color: #2d3436;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

/* ---------- screens: fade + scale transitions ---------- */
.screen {
  position: fixed; inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  opacity: 0;
  pointer-events: none;
  transform: scale(.97) translateY(12px);
  transition: opacity .38s ease, transform .38s ease;
}
.screen.active {
  opacity: 1;
  pointer-events: auto;
  transform: none;
}

#battleScreen {
  background:
    linear-gradient(#ccd3db 1px, transparent 1px),
    linear-gradient(90deg, #ccd3db 1px, transparent 1px),
    #dfe4ea;
  background-size: 44px 44px;
  justify-content: flex-start;
  padding-top: 8px;
}

h1 { font-size: 32px; letter-spacing: 3px; font-weight: 900; color: #0984e3; text-align: center; }
h1 span { color: #e17055; }
.tagline { font-size: 13px; color: #636e72; margin-top: -6px; }

/* ---------- mode select ---------- */
.modeBtn {
  width: min(78vw, 300px);
  border: none; border-radius: 16px;
  padding: 18px 20px; font-size: 17px; font-weight: 900;
  cursor: pointer; text-align: left;
  transition: transform .1s, box-shadow .1s;
  box-shadow: 0 5px 0 rgba(0,0,0,.18);
}
.modeBtn small { display: block; font-weight: 600; font-size: 11px; opacity: .85; margin-top: 3px; }
.modeBtn:active { transform: scale(.95); }
.modeBtn.bot    { background: linear-gradient(135deg,#0984e3,#74b9ff); color: #fff; }
.modeBtn.friend { background: linear-gradient(135deg,#e17055,#fab1a0); color: #fff; }

/* ---------- draw screen ---------- */
#drawTitle { font-size: 16px; font-weight: 900; color: #57606f; letter-spacing: 1px; }

#drawWrap {
  width: min(70vw, 320px); height: min(70vw, 320px);
  border-radius: 50%;
  background: #0d1117;
  box-shadow: 0 10px 30px rgba(45,52,54,.35), inset 0 0 0 3px #39424e, 0 0 26px rgba(9,132,227,.25);
  display: flex; align-items: center; justify-content: center;
}
#drawCanvas {
  width: 88%; height: 88%;
  border-radius: 50%;
  background:
    radial-gradient(circle, transparent 63%, rgba(255,255,255,.16) 65%, transparent 66%),
    radial-gradient(circle, transparent 30%, rgba(255,255,255,.16) 32%, transparent 33%),
    #0d1117;
  touch-action: none;
  cursor: crosshair;
}

#statPreview { width: min(80vw, 340px); display: flex; flex-direction: column; gap: 5px; }
.stat { display: grid; grid-template-columns: 42px 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; }
.stat label { grid-row: span 2; font-size: 11px; font-weight: 800; color: #636e72; }
.stat .hint { grid-column: 2; font-size: 10px; color: #98a0a6; }
.bar { height: 10px; background: #cdd3da; border-radius: 6px; overflow: hidden; }
.fillb { height: 100%; width: 0%; border-radius: 6px; transition: width .15s; background: linear-gradient(90deg,#0984e3,#74b9ff); }
#barAtk.fillb   { background: linear-gradient(90deg,#d63031,#ff7675); }
#barBal.fillb   { background: linear-gradient(90deg,#00b894,#55efc4); }

/* ---------- buttons ---------- */
.btnRow { display: flex; gap: 10px; }
.btn {
  border: none; border-radius: 12px;
  padding: 12px 20px; font-size: 15px; font-weight: 800;
  cursor: pointer; transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: scale(.94); }
.btn.primary { background: #0984e3; color: #fff; box-shadow: 0 4px 0 #0767b2; }
.btn.primary:active { box-shadow: 0 1px 0 #0767b2; }
.btn.ghost { background: #fff; color: #57606f; box-shadow: 0 4px 0 #b9c0c8; }
.btn.ghost:active { box-shadow: 0 1px 0 #b9c0c8; }

/* ---------- battle HUD ---------- */
#hud {
  width: min(96vw, 480px);
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,.78);
  border-radius: 14px; padding: 9px 12px;
  box-shadow: 0 6px 18px rgba(45,52,54,.12);
  z-index: 5;
}
#vs { font-weight: 900; color: #b2bec3; font-size: 14px; }
.hpSide { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.hpSide.right { align-items: flex-end; }
.hpbar { width: 100%; height: 14px; background: #e3e7ec; border-radius: 8px; overflow: hidden; }
.fill { height: 100%; width: 100%; border-radius: 8px; transition: width .12s; }
.fill.blue   { background: linear-gradient(90deg,#0984e3,#74b9ff); }
.fill.orange { background: linear-gradient(90deg,#e17055,#fab1a0); }
.spinbar { width: 100%; height: 5px; background: #e3e7ec; border-radius: 4px; overflow: hidden; }
.spinbar div { height: 100%; width: 100%; background: #00cec9; transition: width .12s; }
.name { font-size: 10px; font-weight: 800; color: #636e72; letter-spacing: 1px; }

#arenaWrap {
  position: relative;
  line-height: 0;
  box-shadow: 0 24px 60px rgba(45,52,54,.35);
  z-index: 1;
}
#arenaWrap canvas { display: block; }

/* ---------- countdown ---------- */
#countOverlay {
  position: absolute; left: 0; right: 0; top: 42%;
  display: flex; justify-content: center;
  pointer-events: none; z-index: 9;
}
#countText {
  font-size: 92px; font-weight: 900; font-style: italic;
  color: #2d3436; letter-spacing: 4px;
  text-shadow: 0 6px 0 rgba(255,255,255,.8), 0 10px 28px rgba(45,52,54,.35);
  opacity: 0;
}
#countText.pop { animation: countPop .85s ease-out forwards; }
@keyframes countPop {
  0%   { opacity: 0; transform: scale(.2) rotate(-6deg); }
  30%  { opacity: 1; transform: scale(1.15) rotate(2deg); }
  75%  { opacity: 1; transform: scale(1) rotate(0deg); }
  100% { opacity: 0; transform: scale(1.05); }
}

#dashFlash {
  position: fixed; left: 50%; top: 38%;
  transform: translate(-50%,-50%) rotate(-6deg);
  font-size: 44px; font-weight: 900; font-style: italic;
  letter-spacing: 2px; color: #00b894;
  text-shadow: 0 0 18px rgba(0,184,148,.8), 0 4px 0 #067a63, 3px 3px 0 #fff;
  pointer-events: none; z-index: 8;
  animation: dashPop .9s ease-out forwards;
}
#dashFlash.hidden { display: none; }
@keyframes dashPop {
  0%   { opacity: 0; transform: translate(-50%,-50%) rotate(-6deg) scale(.3); }
  25%  { opacity: 1; transform: translate(-50%,-50%) rotate(-6deg) scale(1.15); }
  70%  { opacity: 1; transform: translate(-50%,-50%) rotate(-6deg) scale(1); }
  100% { opacity: 0; transform: translate(-50%,-60%) rotate(-6deg) scale(1); }
}

/* ---------- result overlay: slide + fade in ---------- */
#resultOverlay {
  position: absolute; inset: 0; z-index: 10;
  background: rgba(45,52,54,.55);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
  backdrop-filter: blur(2px);
  opacity: 1;
  transform: translateY(0);
  transition: opacity .45s ease, transform .45s ease;
}
#resultOverlay.hidden {
  opacity: 0;
  pointer-events: none;
  transform: translateY(26px);
}
#resultText {
  font-size: 42px; font-weight: 900; font-style: italic; letter-spacing: 3px;
  color: #fff; text-shadow: 0 6px 24px rgba(0,0,0,.45), 3px 3px 0 rgba(0,0,0,.25);
  transform: rotate(-3deg);
  text-align: center;
}
#resultSub { font-size: 18px; font-weight: 800; color: #ffeaa7; letter-spacing: 2px; margin-bottom: 12px; }

#glError {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  background: #2d3436; color: #fff; font-size: 15px;
  padding: 30px; text-align: center;
}
#glError.hidden { display: none; }
</style>
</head>
<body>

  <!-- ============ MODE SELECT ============ -->
  <section id="modeScreen" class="screen active">
    <h1>BLADE<span>ART</span>FIGHT</h1>
    <p class="tagline">Draw your blade. Ride the X-rail. Xtreme Dash.</p>
    <button id="btnVsBot" class="modeBtn bot">&#129302; VS BOT<small>Battle a procedurally-drawn rival blade</small></button>
    <button id="btnVsFriend" class="modeBtn friend">&#128101; VS FRIEND<small>Pass &amp; play: you both draw, then fight</small></button>
  </section>

  <!-- ============ DRAW SCREEN ============ -->
  <section id="drawScreen" class="screen">
    <h1>BLADE<span>ART</span>FIGHT</h1>
    <p id="drawTitle">DRAW YOUR BLADE</p>

    <div id="drawWrap">
      <canvas id="drawCanvas" width="320" height="320"></canvas>
    </div>

    <div id="statPreview">
      <div class="stat"><label>HP</label><div class="bar"><div id="barHp" class="fillb"></div></div><span class="hint">bigger drawing = tank</span></div>
      <div class="stat"><label>ATK</label><div class="bar"><div id="barAtk" class="fillb"></div></div><span class="hint">spiky edge = ouch</span></div>
      <div class="stat"><label>SPIN</label><div class="bar"><div id="barBal" class="fillb"></div></div><span class="hint">symmetric = spins long</span></div>
    </div>

    <div class="btnRow">
      <button id="btnClear"  class="btn ghost">Clear</button>
      <button id="btnRandom" class="btn ghost">&#127922; Random</button>
      <button id="btnFight"  class="btn primary">LET IT RIP!</button>
    </div>
  </section>

  <!-- ============ BATTLE SCREEN ============ -->
  <section id="battleScreen" class="screen">
    <div id="hud">
      <div class="hpSide">
        <div class="hpbar"><div id="hpPlayer" class="fill blue"></div></div>
        <div class="spinbar"><div id="spinPlayer"></div></div>
        <span class="name" id="nameLeft">YOU</span>
      </div>

        <span class="name" id="nameRight">BOT</span>
      </div>
    </div>

    <div id="arenaWrap"></div>

    <div id="countOverlay"><div id="countText"></div></div>
    <div id="dashFlash" class="hidden">XTREME DASH!</div>

    <div id="resultOverlay" class="hidden">
      <h2 id="resultText"></h2>
      <p id="resultSub"></p>
      <div class="btnRow">
        <button id="btnRematch"   class="btn primary">Rematch</button>
        <button id="btnNewBlade"  class="btn ghost">New Blade</button>
      </div>
    </div>
  </section>

  <div id="glError" class="hidden">3D could not start on this device/browser (WebGL unavailable).<br>Try another browser like Chrome.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =========================================================
   BladeArtFight v2 - clean rewrite, single file
   sections:
     1. UTILS   - drawing analysis (stats), silhouette masks
     2. BATTLE  - Matter.js physics, beyblade-type AI, X-rail,
                  Xtreme Dash, exits, launch/intro support
     3. R3D     - Three.js stadium, tops (blade+ratchet+bit),
                  camera direction, intro/end sequences, sparks
     4. MAIN    - UI glue, screens, HUD, countdown, sounds
   ========================================================= */

/* =================== 1. UTILS =================== */

function getMask(canvas) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const data = ctx.getImageData(0, 0, W, H).data;
  const mask = new Uint8Array(W * H);
  let count = 0;
  for (let i = 0; i < W * H; i++) {
    if (data[i * 4 + 3] > 40) { mask[i] = 1; count++; }
  }
  return { mask, count, W, H };
}

/* drawing -> stats: your art IS the build */
function analyzeBlade(canvas) {
  const { mask, count, W, H } = getMask(canvas);
  if (count < 30) return null;
  const cx = W / 2, cy = H / 2;

  let sx = 0, sy = 0;
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++)
      if (mask[y * W + x]) { sx += x; sy += y; }
  const mx = sx / count, my = sy / count;

  let maxR = 0;
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++)
      if (mask[y * W + x]) {
        const d = Math.hypot(x - cx, y - cy);
        if (d > maxR) maxR = d;
      }

  let per = 0;
  for (let y = 1; y < H - 1; y++)
    for (let x = 1; x < W - 1; x++)
      if (mask[y * W + x] &&
         (!mask[y * W + x - 1] || !mask[y * W + x + 1] ||
          !mask[(y - 1) * W + x] || !mask[(y + 1) * W + x])) per++;

  /* spikiness: perimeter^2 / (4 pi area); 1 = perfect circle */
  const roundness = (per * per) / (4 * Math.PI * count);
  const spikiness = Math.min(1, Math.max(0, roundness - 1) / 2.2);

  let overlap = 0;
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++)
      if (mask[y * W + x] && mask[y * W + (W - 1 - x)]) overlap++;
  const symmetry = overlap / count;

  const fill = Math.min(1, count / (0.28 * W * H));

  return {
    hp:     Math.round(90 + 130 * fill),
    atk:    Math.round(6 + 46 * spikiness),
    bal:    symmetry,
    r:      Math.max(26, Math.min(78, maxR)),
    wobble: Math.min(1, Math.hypot(mx - cx, my - cy) / (W * 0.3)),
    mx, my,
  };
}

/* random blade generator (bot + lazy players) */
function makeRandomBlade(canvas) {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff';
  ctx.lineCap = ctx.lineJoin = 'round';
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const kind = Math.floor(Math.random() * 3);

  if (kind === 0) {                        // star
    const spikes = 5 + Math.floor(Math.random() * 5);
    const R = 110 + Math.random() * 25;
    const r = R * (0.35 + Math.random() * 0.25);
    ctx.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const rad = i % 2 ? r : R;
      const a = (i * Math.PI) / spikes - Math.PI / 2;
      ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
    }
    ctx.closePath(); ctx.fill();
  } else if (kind === 1) {                 // blob cluster
    const n = 5 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const d = 68 + Math.random() * 30;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 22 + Math.random() * 14, 0, 7);
      ctx.fill();
    }
    ctx.beginPath(); ctx.arc(cx, cy, 30, 0, 7); ctx.fill();
  } else {                                 // jagged saw disc
    const R = 100 + Math.random() * 25, n = 26;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * Math.PI * 2;
      const rad = R * (0.72 + Math.random() * 0.33);
      ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
    }
    ctx.closePath(); ctx.fill();
  }
}

function cloneCanvas(src) {
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  c.getContext('2d').drawImage(src, 0, 0);
  return c;
}

/* =================== 2. BATTLE (physics) =================== */

const Battle = (() => {
  const { Engine, Bodies, Body, Composite, Events, Vector } = Matter;

  const S = 1600;                       // stadium side, world units
  const WALL_T = 60;
  const RAIL_W = 62;                    // X-rail catch width
  const DASH_TICKS = 45;
  /* exit gaps in the north wall: two Over Zones + wide Xtreme Zone */
  const EXIT_GAPS = [ [300, 400], [700, 900], [1200, 1300] ];
  /* the X-Celerator rails, corner to corner */
  const RAILS = [
    { ax: 80,   ay: 80,   bx: 1520, by: 1520 },
    { ax: 1520, ay: 80,   bx: 80,   by: 1520 },
  ];

  let engine = null, raf = null;
  let running = false, inited = false, frozen = true;
  let player = null, enemy = null;
  let pStats = null, eStats = null;
  let hp = { p: 0, e: 0 };
  let spin = { p: 1, e: 1 };
  let dash = { p: 0, e: 0 };
  let warmup = 0;                    // ticks after launch before any dash
  const railT = { p: 0, e: 0 };      // consecutive ticks spent riding the rail
  let onEnd = null;

  const arenaSize = () =>
    Math.floor(Math.min(window.innerWidth - 8, window.innerHeight - 158));

  /* Beyblade-type personality from the drawing's stats:
     ATK dominant -> ATTACK  |  HP dominant -> DEFENSE
     BAL dominant -> STAMINA |  mixed        -> BALANCE */
  function personaOf(stats) {
    const aN = (stats.atk - 6) / 46, hN = (stats.hp - 90) / 130, bN = stats.bal;
    const vals = [aN, hN, bN].sort((x, y) => y - x);
    if (vals[0] < 0.25 || vals[0] - vals[1] < 0.08) return 'balance';
    if (vals[0] === aN) return 'attack';
    if (vals[0] === hN) return 'defense';
    return 'stamina';
  }

  function buildWalls() {
    const opt = { isStatic: true, restitution: 0.6, render: { visible: false } };
    const walls = [
      Bodies.rectangle(S / 2, S + WALL_T / 2, S + 2 * WALL_T, WALL_T, opt),
      Bodies.rectangle(-WALL_T / 2, S / 2, WALL_T, S + 2 * WALL_T, opt),
      Bodies.rectangle(S + WALL_T / 2, S / 2, WALL_T, S + 2 * WALL_T, opt),
    ];
    let prev = 0;
    const spans = [];
    for (const [a, b] of EXIT_GAPS) { spans.push([prev, a]); prev = b; }
    spans.push([prev, S]);
    for (const [a, b] of spans)
      walls.push(Bodies.rectangle((a + b) / 2, -WALL_T / 2, b - a, WALL_T, opt));
    return walls;
  }

  /* bit type changes how the top glides: flat attack bits slip fast,
     ball/needle defense+stamina bits are calmer */
  function makeBlade(stats, x, y) {
    const P = personaOf(stats);
    const glide = { attack: 0.003, balance: 0.004, stamina: 0.005, defense: 0.006 }[P];
    const bounce = { attack: 0.6, balance: 0.5, stamina: 0.55, defense: 0.45 }[P];
    const b = Bodies.circle(x, y, stats.r, {
      label: 'blade', restitution: bounce, friction: 0.02, frictionAir: glide,
    });
    b.plugin = {
      persona: P, mode: 'attack', modeCd: 300,
      precess: Math.random() < 0.5 ? -1 : 1, precessCd: 60 + Math.random() * 120,
      nudge: 0, nudgeCd: 90 + Math.random() * 150,
      curCd: 150, wobPh: Math.random() * 6,
    };
    return b;
  }

  function clampSpeed(b, max) {
    const v = b.velocity, s = Math.hypot(v.x, v.y);
    if (s > max) Body.setVelocity(b, { x: (v.x / s) * max, y: (v.y / s) * max });
  }

  /* ---------- X-rail: gears catch the rail, accelerate to centre,
     hop off with an XTREME DASH ---------- */
  function distToRails(p) {
    let best = null;
    for (const r of RAILS) {
      const abx = r.bx - r.ax, aby = r.by - r.ay;
      const L2 = abx * abx + aby * aby;
      let t = ((p.x - r.ax) * abx + (p.y - r.ay) * aby) / L2;
      t = Math.max(0, Math.min(1, t));
      const cx = r.ax + abx * t, cy = r.ay + aby * t;
      const d = Math.hypot(p.x - cx, p.y - cy);
      if (d < RAIL_W && (!best || d < best.d)) best = { d, cx, cy };
    }
    return best;
  }

  function handleRail(b, key) {
    if (frozen || spin[key] <= 0) return;
    const ri = distToRails(b.position);
    if (!ri) { railT[key] = 0; return; }
    railT[key]++;
    const dir = {
      x: Math.sign(S / 2 - b.position.x) || 1,
      y: Math.sign(S / 2 - b.position.y) || 1,
    };
    const n = Math.hypot(dir.x, dir.y);
    Body.applyForce(b, b.position, {
      x: (dir.x / n) * 0.30 * b.mass,
      y: (dir.y / n) * 0.30 * b.mass,
    });
    clampSpeed(b, 8.5);
    spin[key] = Math.min(1, spin[key] + 0.004);     // gears feed spin back
    const L = Math.hypot(S / 2 - b.position.x, S / 2 - b.position.y);
    /* XTREME DASH: needs a sustained rail ride and the warmup over */
    if (L < 240 && dash[key] <= 0 && warmup <= 0 && railT[key] > 45) {
      dash[key] = DASH_TICKS;
      if (window.onXtreme) window.onXtreme(key);
    }
  }

  /* ---------- free type-based movement (no homing) ---------- */
  function freeMove(self, other, stats, key) {
    if (spin[key] <= 0) { clampSpeed(self, 0.4); return; }
    if (self.position.y < 0) return;          // escaping through an exit

    const v = self.velocity, s = Math.hypot(v.x, v.y);

    if (self.plugin.persona === 'balance') {
      if (--self.plugin.modeCd <= 0) {
        self.plugin.mode = self.plugin.mode === 'attack' ? 'stamina' : 'attack';
        self.plugin.modeCd = 300 + Math.random() * 200;
      }
    }
    const P = self.plugin.persona === 'balance' ? self.plugin.mode : self.plugin.persona;

    /* precession: sideways push => curved paths. attack turns hardest */
    const turnMul = P === 'attack' ? 2.3 : P === 'defense' ? 0.8 : 1.2;
    if (s > 0.1) {
      const pf = 0.017 * turnMul * self.mass * (0.3 + 0.7 * spin[key]);
      Body.applyForce(self, self.position, {
        x: (-v.y / s) * pf * self.plugin.precess,
        y: ( v.x / s) * pf * self.plugin.precess,
      });
    }
    if (--self.plugin.precessCd <= 0) {
      self.plugin.precess *= -1;
      self.plugin.precessCd = 110 + Math.random() * 170;
    }

    /* tiny random drift so no two orbits are the same */
    Body.applyForce(self, self.position, {
      x: (Math.random() - 0.5) * 0.010 * self.mass,
      y: (Math.random() - 0.5) * 0.010 * self.mass,
    });

    const d = Vector.sub(other.position, self.position);
    const dist = Math.hypot(d.x, d.y) || 1;
    let cap = 5.4;

    if (P === 'attack') {
      /* constant hunt + periodic hard charges => constant contact */
      cap = 6.2;
      Body.applyForce(self, self.position, { x: (d.x / dist) * 0.038 * self.mass, y: (d.y / dist) * 0.038 * self.mass });
      if (--self.plugin.nudgeCd <= 0) { self.plugin.nudge = 30; self.plugin.nudgeCd = 90 + Math.random() * 120; }
    } else if (P === 'defense') {
      /* hold the centre in a tight circle; poke only when approached */
      cap = 4.0;
      const dc = Math.hypot(self.position.x - S / 2, self.position.y - S / 2) || 1;
      const hf = dc > 200 ? 0.050 : 0.018;
      Body.applyForce(self, self.position, {
        x: ((S / 2 - self.position.x) / dc) * hf * self.mass,
        y: ((S / 2 - self.position.y) / dc) * hf * self.mass,
      });
      if (dist < 320 && --self.plugin.curCd <= 0) { self.plugin.nudge = 22; self.plugin.curCd = 160 + Math.random() * 140; }
    } else {
      /* stamina: cruise a slow ring around the middle of the stadium */
      cap = 5.0;
      const t = engine.timing.timestamp * 0.0012 + self.plugin.wobPh;
      const tx = S / 2 + Math.cos(t) * 340;
      const ty = S / 2 + Math.sin(t) * 340;
      const dx = tx - self.position.x, dy = ty - self.position.y;
      const dd = Math.hypot(dx, dy) || 1;
      Body.applyForce(self, self.position, { x: (dx / dd) * 0.030 * self.mass, y: (dy / dd) * 0.030 * self.mass });
      if (dist > 220 && --self.plugin.curCd <= 0) { self.plugin.nudge = 22; self.plugin.curCd = 210 + Math.random() * 170; }
    }

    /* a triggered nudge: brief curve toward the opponent */
    if (self.plugin.nudge > 0) {
      Body.applyForce(self, self.position, { x: (d.x / dist) * 0.048 * self.mass, y: (d.y / dist) * 0.048 * self.mass });
      self.plugin.nudge--;
    }

    /* during an Xtreme Dash the top actively charges the opponent */
    if (dash[key] > 0) {
      Body.applyForce(self, self.position, { x: (d.x / dist) * 0.10 * self.mass, y: (d.y / dist) * 0.10 * self.mass });
    }

    /* wobble: unbalanced blades drift sideways as they spin */
    if (stats.wobble > 0.05 && s > 0.1) {
      const t = engine.timing.timestamp * 0.012 + self.plugin.wobPh;
      const wf = Math.sin(t) * stats.wobble * 0.028 * self.mass;
      Body.applyForce(self, self.position, { x: (-v.y / s) * wf, y: (v.x / s) * wf });
    }

    /* a top slows down as its spin dies */
    clampSpeed(self, cap * (0.25 + 0.75 * spin[key]) + (dash[key] > 0 ? 4.2 : 0));
  }

  function tick() {
    if (!running) return;

    if (frozen) {
      /* intro: tops spin in place at the launch zones, no forces */
      Body.setVelocity(player, { x: 0, y: 0 });
      Body.setVelocity(enemy, { x: 0, y: 0 });
      Body.setAngularVelocity(player, -0.36);
      Body.setAngularVelocity(enemy,  0.36);
      Engine.update(engine, 1000 / 60);
      HUD.update(hp, spin);
      raf = requestAnimationFrame(tick);
      return;
    }

    if (warmup > 0) warmup--;
    handleRail(player, 'p');
    handleRail(enemy, 'e');
    freeMove(player, enemy, pStats, 'p');
    freeMove(enemy, player, eStats, 'e');

    dash.p = Math.max(0, dash.p - 1);
    dash.e = Math.max(0, dash.e - 1);

    spin.p = Math.max(0, spin.p - 0.00020 * (1.7 - pStats.bal) * (1 + pStats.wobble));
    spin.e = Math.max(0, spin.e - 0.00020 * (1.7 - eStats.bal) * (1 + eStats.wobble));
    Body.setAngularVelocity(player, -0.36 * spin.p);
    Body.setAngularVelocity(enemy,  0.36 * spin.e);

    Engine.update(engine, 1000 / 60);

    /* GRIND: while the blades touch, HP and spin tick down gradually.
       longer contact = more damage, like real tops chewing each other */
    const rr = pStats.r + eStats.r;
    const gdx = enemy.position.x - player.position.x;
    const gdy = enemy.position.y - player.position.y;
    const gd = Math.hypot(gdx, gdy);
    if (gd < rr + 8) {
      const rvx = player.velocity.x - enemy.velocity.x;
      const rvy = player.velocity.y - enemy.velocity.y;
      const gs = Math.hypot(rvx, rvy);
      if (gs > 0.6) {
        const pDash = dash.p > 0, eDash = dash.e > 0;
        hp.p -= Math.min(1.1, eStats.atk * gs * 0.0016 * (eDash ? 2.2 : 1));
        hp.e -= Math.min(1.1, pStats.atk * gs * 0.0016 * (pDash ? 2.2 : 1));
        spin.p = Math.max(0, spin.p - gs * 0.0012);
        spin.e = Math.max(0, spin.e - gs * 0.0012);
        const midX = (player.position.x + enemy.position.x) / 2;
        const midY = (player.position.y + enemy.position.y) / 2;
        if (engine.timing.timestamp % 90 < 16 && window.impactFX)
          window.impactFX(midX, midY, Math.min(1, gs / 8));
        if (engine.timing.timestamp % 300 < 16 && window.blip)
          window.blip(0.25);
      }
    }

    HUD.update(hp, spin);
    if (!checkEnd()) raf = requestAnimationFrame(tick);
  }

  function checkEnd() {
    /* exits: crossing the north wall plane through a gap */
    for (const [b, key] of [[player, 'p'], [enemy, 'e']]) {
      if (b.position.y < -30) {
        const x = b.position.x;
        let finish = 'over';
        for (const [a, b2] of EXIT_GAPS)
          if (x >= a - 10 && x <= b2 + 10) finish = (b2 - a) > 150 ? 'xtreme' : 'over';
        return endMatch({ winner: key === 'p' ? 'bot' : 'player', finish });
      }
    }
    const pDead = hp.p <= 0, eDead = hp.e <= 0;
    const pOut = spin.p <= 0.02, eOut = spin.e <= 0.02;
    if ((pDead || pOut) && (eDead || eOut))
      return endMatch({ winner: hp.p > hp.e ? 'player' : hp.p < hp.e ? 'bot' : 'draw', finish: 'burst' });
    if (pDead) return endMatch({ winner: 'bot', finish: 'burst' });
    if (pOut)  return endMatch({ winner: 'bot', finish: 'spinout' });
    if (eDead) return endMatch({ winner: 'player', finish: 'burst' });
    if (eOut)  return endMatch({ winner: 'player', finish: 'spinout' });
    return null;
  }

  function endMatch(result) {
    running = false;
    if (raf) cancelAnimationFrame(raf);
    HUD.update(hp, spin);
    if (window.battleShake) window.battleShake(14);
    if (window.onMatchEnd) window.onMatchEnd(result);      // 3D celebration starts now
    setTimeout(() => { cleanup(); if (onEnd) onEnd(result); }, 1600);
    return true;
  }

  function cleanup() {
    if (!inited) return;
    try {
      Events.off(engine);
      Composite.clear(engine.world, false);
      Engine.clear(engine);
    } catch (e) {}
    inited = false;
  }

  /* damage on contact; a dashing attacker deals bonus damage
     and launches the victim (that is how exits are scored) */
  function onCollision(ev) {
    for (const pair of ev.pairs) {
      const a = pair.bodyA, b = pair.bodyB;
      if (a.label !== 'blade' || b.label !== 'blade') continue;
      const speed = Vector.magnitude(Vector.sub(a.velocity, b.velocity));
      if (speed < 2) continue;
      const aDash = (a === player ? dash.p : dash.e) > 0;
      const bDash = (b === player ? dash.p : dash.e) > 0;

      /* impact shock: small chunk. sustained damage comes from grinding */
      const dmgToA = Math.min(8, b.plugin.statsRef.atk * speed * 0.008 * (bDash ? 2.2 : 1));
      const dmgToB = Math.min(8, a.plugin.statsRef.atk * speed * 0.008 * (aDash ? 2.2 : 1));
      hp[a === player ? 'p' : 'e'] -= dmgToA;
      hp[b === player ? 'p' : 'e'] -= dmgToB;

      if (bDash) Body.setVelocity(a, { x: a.velocity.x + b.velocity.x * 0.9, y: a.velocity.y + b.velocity.y * 0.9 });
      if (aDash) Body.setVelocity(b, { x: b.velocity.x + a.velocity.x * 0.9, y: b.velocity.y + a.velocity.y * 0.9 });

      spin.p = Math.max(0, spin.p - speed * 0.003);
      spin.e = Math.max(0, spin.e - speed * 0.003);

      /* impact FX at the midpoint */
      if (window.impactFX) window.impactFX(
        (a.position.x + b.position.x) / 2,
        (a.position.y + b.position.y) / 2,
        Math.min(1, speed / 8)
      );
      if (window.battleShake) window.battleShake(Math.min(10, speed));
      if (window.blip) window.blip(Math.min(1, speed / 8));
    }
  }

  /* fresh match: tops placed frozen (spinning in place) until launch() */
  function start(pCanvas, eCanvas, ps, es, endCb) {
    if (running) return;
    cleanup();
    onEnd = endCb;
    pStats = ps; eStats = es;
    hp = { p: ps.hp, e: es.hp };
    spin = { p: 1, e: 1 };
    dash = { p: 0, e: 0 };
    warmup = 200;                    // ~3.3s after the rip: no dashes yet
    railT.p = 0; railT.e = 0;

    engine = Engine.create();
    engine.gravity.y = 0;

    player = makeBlade(ps, S / 2, S * 0.74);
    enemy  = makeBlade(es, S / 2, S * 0.26);
    player.plugin.statsRef = ps;
    enemy.plugin.statsRef = es;
    Composite.add(engine.world, [...buildWalls(), player, enemy]);

    Events.on(engine, 'collisionStart', onCollision);

    inited = true;
    frozen = true;
    running = true;
    HUD.setMaxes(ps.hp, es.hp);
    raf = requestAnimationFrame(tick);
  }

  /* the rip: launch both tops from their zones */
  function launch() {
    if (!inited) return;
    frozen = false;
    /* tangential launch: tops enter wide natural orbits, not rail-seeking */
    Body.setVelocity(player, { x: -4.2, y: 0.8 });
    Body.setVelocity(enemy,  { x:  4.2, y: -0.8 });
  }

  function getState() {
    if (!inited) return { running: false, frozen: true };
    const bs = (b, key) => ({
      x: b.position.x, y: b.position.y, angle: b.angle,
      vx: b.velocity.x, vy: b.velocity.y,
      spin: spin[key], dash: dash[key] > 0, hp: hp[key],
      persona: b.plugin.persona,
    });
    return { running, frozen, player: bs(player, 'p'), enemy: bs(enemy, 'e') };
  }

  return { start, launch, getState, arenaSize, S, EXIT_GAPS, RAILS, personaOf };
})();

/* =================== 3. R3D (Three.js) =================== */

const R3D = (() => {
  if (!window.THREE) return { start() {}, stop() {}, celebrate() {} };

  const S = 1600;                          // must match Battle.S
  let renderer = null, scene = null, camera = null;
  let topP = null, topE = null;
  let pStats = null, eStats = null;
  let raf = null, mode = 'idle';
  let introT0 = 0, endT0 = 0, introStage = 0;
  let endWinner = 'p', endFinish = 'burst';
  let shake = 0, fovKick = 0;
  const BASE_FOV = 52;
  const CAM_DIR = new THREE.Vector3(0, 0.66, 1.0).normalize();
  let camDist = 1500;

  /* ---------- tiny synth sounds are in MAIN; FX helpers below ---------- */

  function gridTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const x = c.getContext('2d');
    x.fillStyle = '#cfd6dd'; x.fillRect(0, 0, 256, 256);
    x.strokeStyle = '#b9c2cb'; x.lineWidth = 3;
    x.strokeRect(0, 0, 256, 256);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(18, 18);
    return t;
  }

  /* tint the white drawing into team color, circular crop, guide ring */
  function artTexture(srcCanvas, color) {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const x = c.getContext('2d');
    x.beginPath(); x.arc(256, 256, 254, 0, 7); x.clip();
    x.drawImage(srcCanvas, 0, 0, 512, 512);
    x.globalCompositeOperation = 'source-in';
    x.fillStyle = color;
    x.fillRect(0, 0, 512, 512);
    x.globalCompositeOperation = 'source-over';
    x.strokeStyle = 'rgba(255,255,255,.9)';
    x.lineWidth = 12;
    x.beginPath(); x.arc(256, 256, 246, 0, 7); x.stroke();
    const t = new THREE.CanvasTexture(c);
    return t;
  }

  /* ---------- the stadium (Beyblade X square Xtreme dish) ---------- */
  function buildStadium() {
    const dish = new THREE.Group();

    const floor = new THREE.Mesh(
      new THREE.BoxGeometry(S, 24, S),
      new THREE.MeshStandardMaterial({ color: 0xeef1f5, roughness: 0.55, metalness: 0.05 })
    );
    floor.position.y = -12;
    floor.receiveShadow = true;

    for (const frac of [0.66, 0.33]) {

      );

      ring.position.y = 0.6;
      dish.add(ring);
    }
    const centre = new THREE.Mesh(
      new THREE.CircleGeometry(72, 48),

    );

    centre.position.y = 0.6;
    dish.add(centre);

    /* slanted walls, north wall split around the exit gaps */
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xf7f9fb, roughness: 0.4, metalness: 0.05 });
    const mkWall = (w, x, z, rx, rz) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, 100, 30), wallMat);
      m.position.set(x, 42, z);
      m.rotation.x = rx; m.rotation.z = rz;

    };
    mkWall(S + 120, 0, S / 2 - 6, -0.35, 0);
    mkWall(S + 120, -S / 2 + 6, 0, 0, 0.35);
    mkWall(S + 120,  S / 2 - 6, 0, 0, -0.35);
    let prev = 0;
    const spans = [];
    for (const [a, b] of Battle.EXIT_GAPS) { spans.push([prev, a]); prev = b; }
    spans.push([prev, S]);
    for (const [a, b] of spans)
      mkWall(b - a, (a + b) / 2 - S / 2, -S / 2 + 6, 0.35, 0);

    /* exit pads: orange over-zones, red xtreme zone */
    for (const [a, b] of Battle.EXIT_GAPS) {
      const wide = (b - a) > 150;
      const pad = new THREE.Mesh(
        new THREE.BoxGeometry(b - a, 3, 110),
        new THREE.MeshStandardMaterial({
          color: wide ? 0xff7675 : 0xfab1a0,
          roughness: 0.5, emissive: wide ? 0x661412 : 0x4d1d12, emissiveIntensity: 0.35,
        })
      );
      pad.position.set((a + b) / 2 - S / 2, 1, -S / 2 - 52);
      pad.receiveShadow = true;
      dish.add(pad);
    }

    /* THE X-CELERATOR RAIL */
    const railMat = new THREE.MeshStandardMaterial({
      color: 0x00b894, roughness: 0.25, metalness: 0.35,
      emissive: 0x00b894, emissiveIntensity: 0.18,
    });
    for (const rot of [Math.PI / 4, -Math.PI / 4]) {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(S * 1.32, 9, 44), railMat);
      rail.position.y = 4;
      rail.rotation.y = rot;
      rail.receiveShadow = true;
      dish.add(rail);
    }

    scene.add(dish);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(7000, 7000),
      new THREE.MeshStandardMaterial({ map: gridTexture(), roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -25;
    ground.receiveShadow = true;
    scene.add(ground);
  }

  /* ---------- silhouette tracing: blade = the EXACT drawn shape ---------- */
  function outlineLoops(canvas) {
    const { mask, W, H } = getMask(canvas);
    const edges = [];
    const adj = new Map();
    const key = (x, y) => x + ',' + y;
    function addEdge(x1, y1, x2, y2) {
      const idx = edges.length;
      edges.push([x1, y1, x2, y2]);
      for (const p of [[x1, y1], [x2, y2]]) {
        const k = key(p[0], p[1]);
        if (!adj.has(k)) adj.set(k, []);
        adj.get(k).push(idx);
      }
    }
    for (let y = 1; y < H - 1; y++)
      for (let x = 1; x < W - 1; x++) {
        if (!mask[y * W + x]) continue;
        if (!mask[(y - 1) * W + x]) addEdge(x, y, x + 1, y);
        if (!mask[(y + 1) * W + x]) addEdge(x, y + 1, x + 1, y + 1);
        if (!mask[y * W + x - 1]) addEdge(x, y, x, y + 1);
        if (!mask[y * W + x + 1]) addEdge(x + 1, y, x + 1, y + 1);
      }
    const used = new Set();
    const loops = [];
    for (let i = 0; i < edges.length; i++) {
      if (used.has(i)) continue;
      used.add(i);
      const pts = [[edges[i][0], edges[i][1]]];
      let cx = edges[i][2], cy = edges[i][3];
      pts.push([cx, cy]);
      let guard = 0;
      while (guard++ < 30000 && !(cx === pts[0][0] && cy === pts[0][1])) {
        const nexts = (adj.get(key(cx, cy)) || []).filter(j => !used.has(j));
        if (!nexts.length) break;
        const j = nexts[0];
        used.add(j);
        const e = edges[j];
        if (e[0] === cx && e[1] === cy) { cx = e[2]; cy = e[3]; }
        else { cx = e[0]; cy = e[1]; }
        pts.push([cx, cy]);
      }
      if (pts.length > 10) loops.push(simplify(pts));
    }
    return loops.filter(l => Math.abs(polyArea(l)) > 120);
  }

  function simplify(pts) {
    const out = [];
    const n = pts.length;
    for (let i = 0; i < n; i++) {
      const a = pts[(i - 1 + n) % n], b = pts[i], c = pts[(i + 1) % n];
      const cross = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
      if (Math.abs(cross) > 0.01) out.push(b);
    }
    return out.length >= 3 ? out : pts;
  }

  function polyArea(pts) {
    let a = 0;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length];
      a += p[0] * q[1] - q[0] * p[1];
    }
    return a / 2;
  }

  function pointIn(pt, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
      if (((yi > pt[1]) !== (yj > pt[1])) &&
          (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }

  /* ---------- the top: authentic three-part build ----------
     Blade   : the drawn silhouette, extruded (gear chip on top)
     Ratchet : protrusion count + height by type (like 3-60 / 5-80)
     Bit     : tip shape decides movement (flat/ball/needle/taper) */
  function buildTop(artCanvas, color, accent, stats) {
    const g = new THREE.Group();
    const persona = Battle.personaOf(stats);

    const artTex = artTexture(artCanvas, color);
    artTex.wrapS = artTex.wrapT = THREE.RepeatWrapping;
    artTex.repeat.set(1 / 320, 1 / 320);   // cap UVs are raw canvas px
    artTex.flipY = false;
    const capMat = new THREE.MeshStandardMaterial({ map: artTex, roughness: 0.35, metalness: 0.3 });
    const sideMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(color), roughness: 0.3, metalness: 0.45 });

    /* --- BLADE: drawn silhouette(s) --- */
    const spinGroup = new THREE.Group();
    const ox = stats.mx || 160, oy = stats.my || 160;

    const loops = outlineLoops(artCanvas)
      .map(pts => ({ pts, area: Math.abs(polyArea(pts)) }))
      .sort((a, b) => b.area - a.area);
    const roots = [];
    for (const o of loops) {
      const host = loops.find(x => x !== o && x.area > o.area && pointIn(o.pts[0], x.pts));
      if (host) (host.holes = host.holes || []).push(o.pts);
      else roots.push(o);
    }
    for (const o of roots.slice(0, 12)) {
      const shape = new THREE.Shape(o.pts.map(p => new THREE.Vector2(p[0], p[1])));
      for (const h of (o.holes || []))
        shape.holes.push(new THREE.Path(h.slice().reverse().map(p => new THREE.Vector2(p[0], p[1]))));
      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: 20, bevelEnabled: true, bevelThickness: 8,
        bevelSize: 5, bevelSegments: 2, curveSegments: 3,
      });
      const mesh = new THREE.Mesh(geo, [capMat, sideMat]);
      mesh.castShadow = true;
      mesh.rotation.x = Math.PI / 2;
      mesh.position.set(-ox, 46, -oy);       // spin around the ink's centre of mass
      spinGroup.add(mesh);
    }

    /* --- GEAR CHIP: spinning emblem in the blade centre --- */
    const chip = new THREE.Mesh(
      new THREE.CylinderGeometry(11, 11, 5, 24),
      new THREE.MeshStandardMaterial({ color: new THREE.Color(accent), roughness: 0.25, metalness: 0.7 })
    );
    chip.position.set(-ox, 62, -oy);
    chip.castShadow = true;

    /* --- RATCHET: protrusions + height by type --- */
    /* attack: 3-sided low | balance: 4 mid | defense: 5 tall | stamina: 6 low */
    const profs = { attack: 3, balance: 4, defense: 5, stamina: 6 };
    const rheis = { attack: 12, balance: 18, stamina: 14, defense: 24 };
    const prof = profs[persona], rh = rheis[persona];
    const rr = Math.max(15, stats.r * 0.32);
    const ratchetMat = new THREE.MeshStandardMaterial({ color: 0x454e57, roughness: 0.35, metalness: 0.65 });
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x2d3436, roughness: 0.5, metalness: 0.4 });

    const hexA = new THREE.Mesh(new THREE.CylinderGeometry(rr, rr * 1.06, rh, prof), ratchetMat);
    hexA.position.y = 18 - rh / 2;
    hexA.castShadow = true;

    const ring = new THREE.Mesh(
      new THREE.CylinderGeometry(rr * 1.1, rr * 1.1, 3.5, prof),
      new THREE.MeshStandardMaterial({ color: new THREE.Color(accent), roughness: 0.3, metalness: 0.6, emissive: new THREE.Color(accent), emissiveIntensity: 0.25 })
    );
    ring.position.y = 18 - rh + 1.5;

    const hexB = new THREE.Mesh(new THREE.CylinderGeometry(rr * 0.66, rr * 0.7, rh * 0.55, prof), darkMat);
    hexB.position.y = 18 - rh * 0.32;
    hexB.castShadow = true;

    /* --- BIT: tip shape by type (flat/ball/needle/taper) --- */
    const bitTop = 18 - rh;                 // underside of the ratchet
    const bitH = Math.max(10, bitTop - 2);  // down to the dish floor
    let bit;
    if (persona === 'attack') {
      /* FLAT: wide rubber tip, aggressive movement */
      bit = new THREE.Mesh(
        new THREE.CylinderGeometry(rr * 0.52, rr * 0.58, bitH * 0.6, 20),
        new THREE.MeshStandardMaterial({ color: 0x23272c, roughness: 0.95, metalness: 0.0 })
      );
      bit.position.y = bitTop - bitH * 0.3;
    } else if (persona === 'defense') {
      /* BALL: squashed sphere, stays central */
      bit = new THREE.Mesh(
        new THREE.SphereGeometry(Math.min(14, rr * 0.55), 24, 16),
        new THREE.MeshStandardMaterial({ color: 0xb2bec3, roughness: 0.3, metalness: 0.7 })
      );
      bit.scale.y = 0.78;
      bit.position.y = bitTop - bitH * 0.28;
    } else if (persona === 'stamina') {
      /* NEEDLE: sharp point, maximum stamina */
      bit = new THREE.Mesh(
        new THREE.ConeGeometry(rr * 0.22, bitH, 16),
        new THREE.MeshStandardMaterial({ color: 0x8395a7, roughness: 0.2, metalness: 0.9 })
      );
      bit.rotation.x = Math.PI;
      bit.position.y = bitTop - bitH / 2;
    } else {
      /* TAPER: truncated cone, the hybrid */
      bit = new THREE.Mesh(
        new THREE.CylinderGeometry(rr * 0.2, rr * 0.5, bitH, 20),
        new THREE.MeshStandardMaterial({ color: 0x9aa7b4, roughness: 0.3, metalness: 0.75 })
      );
      bit.position.y = bitTop - bitH / 2;
    }
    bit.castShadow = true;

    /* gear disc under the bit: what catches the X-rail */
    const gear = new THREE.Mesh(
      new THREE.CylinderGeometry(rr * 0.62, rr * 0.62, 3, prof * 4),
      new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.3, metalness: 0.85 })
    );
    gear.position.y = bitTop - bitH * 0.72;

    g.add(spinGroup, chip, hexA, ring, hexB, bit, gear);
    g.userData = { spin: spinGroup, capMat, hexB, chip, persona };
    return g;
  }

  /* ---------- impact spark pool ---------- */
  const sparks = [];
  function initSparks() {
    const geo = new THREE.RingGeometry(5, 9, 24);
    for (let i = 0; i < 10; i++) {
      const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
        color: 0xfff3b0, transparent: true, opacity: 0,
        side: THREE.DoubleSide, depthWrite: false,
      }));
      m.rotation.x = -Math.PI / 2;
      m.visible = false;
      scene.add(m);
      sparks.push({ mesh: m, life: 0, pow: 1 });
    }
  }
  window.impactFX = (wx, wy, pow) => {
    const s = sparks.find(s => s.life <= 0);
    if (!s) return;
    s.life = 1; s.pow = pow;
    s.mesh.position.set(wx - S / 2, 42, wy - S / 2);
    s.mesh.visible = true;
  };
  function updateSparks() {
    for (const s of sparks) {
      if (s.life <= 0) continue;
      s.life -= 0.055;
      const k = 1 - s.life;
      s.mesh.scale.setScalar(1 + k * (10 + s.pow * 10));
      s.mesh.material.opacity = Math.max(0, s.life) * 0.85;
      if (s.life <= 0) s.mesh.visible = false;
    }
  }

  /* ---------- camera ---------- */
  function autoFit() {
    const corners = [
      new THREE.Vector3(-S / 2, 0, -S / 2), new THREE.Vector3(S / 2, 0, -S / 2),
      new THREE.Vector3(-S / 2, 0,  S / 2), new THREE.Vector3(S / 2, 0,  S / 2),
    ];
    camDist = 1600;
    for (let i = 0; i < 60; i++) {
      camera.position.copy(CAM_DIR).multiplyScalar(camDist);
      camera.lookAt(0, 0, -30);
      camera.updateMatrixWorld();
      camera.updateProjectionMatrix();
      let maxAbs = 0;
      for (const c of corners) {
        const ndc = c.clone().project(camera);
        maxAbs = Math.max(maxAbs, Math.abs(ndc.x), Math.abs(ndc.y));
      }
      if (maxAbs <= 0.60) break;
      camDist *= 0.94;
    }
    camDist = Math.max(camDist, 420);
  }

  function camBasePos() {
    return {
      x: CAM_DIR.x * camDist,
      y: CAM_DIR.y * camDist,
      z: CAM_DIR.z * camDist,
    };
  }

  /* ---------- per-frame top placement ---------- */
  function placeTop(mesh, st, stats, dir, t) {
    if (!st) return;
    mesh.position.x = st.x - S / 2;
    mesh.position.z = st.y - S / 2;

    /* spin layers: blade one way, ratchet core + gear chip the other */
    mesh.userData.spin.rotation.y += dir * st.spin * 2.2;
    mesh.userData.hexB.rotation.y -= dir * st.spin * 1.4;
    mesh.userData.chip.rotation.y -= dir * 0.6;

    /* wobble tilt for unbalanced art */
    mesh.rotation.x = Math.sin(t * 0.021) * stats.wobble * 0.22;
    mesh.rotation.z = Math.cos(t * 0.017) * stats.wobble * 0.22;

    /* dash hop + glow */
    const targetY = st.dash ? 34 + Math.sin(t * 0.02) * 6 : 0;
    mesh.position.y += (targetY - mesh.position.y) * 0.2;
    if (st.dash) {
      mesh.userData.capMat.emissive.setHex(0x2dffd8);
      mesh.userData.capMat.emissiveIntensity = 0.75;
    } else {
      mesh.userData.capMat.emissiveIntensity = 0;
    }
  }

  /* ---------- main render loop with mode direction ---------- */
  function loop() {
    if (mode === 'idle') return;
    raf = requestAnimationFrame(loop);
    const st = Battle.getState();
    const t = performance.now();

    placeTop(topP, st.player, pStats, -1, t);
    placeTop(topE, st.enemy, eStats, 1, t);
    updateSparks();

    if (mode === 'intro') {
      /* camera sweeps around the stadium while the countdown runs */
      const k = Math.min(1, (t - introT0) / 2600);
      const a = (1 - k) * Math.PI * 2;
      const F = camBasePos();
      camera.position.set(
        Math.sin(a) * F.z * 1.18,
        F.y * 1.05 + Math.sin(k * Math.PI) * 60,
        Math.cos(a) * F.z * 1.18
      );
      camera.fov = BASE_FOV + 6 * (1 - k);
      camera.updateProjectionMatrix();
      camera.lookAt(0, 0, -30);

      if (introStage === 0 && k >= 0.02) { introStage = 1; if (window.onCount) window.onCount('3'); }
      if (introStage === 1 && k >= 0.36) { introStage = 2; if (window.onCount) window.onCount('2'); }
      if (introStage === 2 && k >= 0.68) { introStage = 3; if (window.onCount) window.onCount('1'); }
      if (k >= 1) {
        mode = 'battle';
        introStage = 0;
        if (window.onIntroDone) window.onIntroDone();
      }
    } else if (mode === 'battle') {
      const anyDash = (st.player && st.player.dash) || (st.enemy && st.enemy.dash);
      fovKick += ((anyDash ? 9 : 0) - fovKick) * 0.12;

      const m = Math.min(1, shake);
      const swayX = Math.sin(t * 0.00035) * 26;
      const swayZ = Math.cos(t * 0.00028) * 20;
      const F = camBasePos();
      const midX = st.player && st.enemy ? ((st.player.x + st.enemy.x) / 2 - S / 2) * 0.9 : 0;
      const midZ = st.player && st.enemy ? ((st.player.y + st.enemy.y) / 2 - S / 2) * 0.9 : 0;
      camera.position.set(
        F.x + midX * 0.30 + swayX + (Math.random() - 0.5) * m * 10,
        F.y + (Math.random() - 0.5) * m * 8,
        F.z + midZ * 0.22 + swayZ + (Math.random() - 0.5) * m * 10
      );
      camera.fov = BASE_FOV + fovKick;
      camera.updateProjectionMatrix();
      camera.lookAt(midX * 0.30, 0, -30 + midZ * 0.22);
      shake *= 0.88;
    } else if (mode === 'end') {
      /* slow push-in on the winner; loser keels over */
      const k = Math.min(1, (t - endT0) / 1400);
      const ease = 1 - Math.pow(1 - k, 3);
      const win = endWinner === 'p' ? topP : topE;
      const lose = endWinner === 'p' ? topE : topP;
      if (win) {
        const target = { x: win.position.x + 110, y: 150, z: win.position.z + 130 };
        const F = camBasePos();
        camera.position.set(
          F.x + (target.x - F.x) * ease,
          F.y + (target.y - F.y) * ease,
          F.z + (target.z - F.z) * ease
        );
        camera.lookAt(win.position.x, 20, win.position.z);
        win.userData.spin.rotation.y += 0.55;
        win.userData.hexB.rotation.y -= 0.35;
      }
      if (lose && endFinish !== 'over' && endFinish !== 'xtreme') {
        lose.rotation.z += (0.85 - lose.rotation.z) * 0.08;
        lose.position.y += (6 - lose.position.y) * 0.08;
      }
      if (k >= 1 && win) {
        /* gentle victory orbit */
        const a = (t - endT0 - 1400) * 0.0005;
        camera.position.set(
          win.position.x + Math.sin(a) * 210,
          170,
          win.position.z + Math.cos(a) * 210
        );
        camera.lookAt(win.position.x, 20, win.position.z);
      }
    }

    renderer.render(scene, camera);
  }

  /* ---------- lifecycle ---------- */
  function initScene() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdfe4ea);
    scene.fog = new THREE.Fog(0xdfe4ea, 2400, 8000);

    camera = new THREE.PerspectiveCamera(BASE_FOV, 1, 10, 12000);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a97a5, 0.7));
    const sun = new THREE.DirectionalLight(0xffffff, 1.05);
    sun.position.set(500, 1100, 350);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -750; sun.shadow.camera.right = 750;
    sun.shadow.camera.top = 750;   sun.shadow.camera.bottom = -750;
    sun.shadow.camera.far = 3200;
    scene.add(sun);

    buildStadium();
    initSparks();
  }

  function start(playerCanvas, enemyCanvas, ps, es) {
    pStats = ps; eStats = es;
    const wrap = document.getElementById('arenaWrap');
    wrap.innerHTML = '';

    const size = Battle.arenaSize();
    if (!renderer) {
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true });
      } catch (e) {
        document.getElementById('glError').classList.remove('hidden');
        return;
      }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      initScene();
    }
    if (topP) scene.remove(topP);
    if (topE) scene.remove(topE);
    topP = buildTop(playerCanvas, '#3b9dff', '#8ecbff', ps);
    topE = buildTop(enemyCanvas, '#ff6a3d', '#ffc48a', es);
    scene.add(topP, topE);

    renderer.setSize(size, size);
    camera.aspect = 1;
    wrap.style.width = size + 'px';
    wrap.style.height = size + 'px';
    wrap.appendChild(renderer.domElement);
    autoFit();

    mode = 'intro';
    introT0 = performance.now();
    introStage = 0;
    shake = 0; fovKick = 0;
    for (const s of sparks) { s.life = 0; s.mesh.visible = false; }
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }

  function celebrate(winnerKey, finish) {
    endWinner = winnerKey;
    endFinish = finish;
    endT0 = performance.now();
    mode = 'end';
  }

  function stop() {
    mode = 'idle';
    if (raf) cancelAnimationFrame(raf);
  }

  window.battleShake = (v) => { shake = Math.min(1.4, shake + v * 0.09); };

  return { start, stop, celebrate };
})();

/* =================== 4. MAIN (UI glue) =================== */

const hpP = document.getElementById('hpPlayer');
const hpE = document.getElementById('hpEnemy');
const spP = document.getElementById('spinPlayer');
const spE = document.getElementById('spinEnemy');
let maxP = 1, maxE = 1;

window.HUD = {
  setMaxes(p, e) { maxP = p; maxE = e; this.update({ p, e }, { p: 1, e: 1 }); },
  update(hp, spin) {
    hpP.style.width = Math.max(0, Math.min(100, (hp.p / maxP) * 100)) + '%';
    hpE.style.width = Math.max(0, Math.min(100, (hp.e / maxE) * 100)) + '%';
    spP.style.width = Math.max(0, spin.p * 100) + '%';
    spE.style.width = Math.max(0, spin.e * 100) + '%';
  },
};

/* ---------- sounds (WebAudio, no assets) ---------- */
let AC = null;
function ac() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    return AC;
  } catch (e) { return null; }
}
window.blip = (intensity = 1) => {
  const ctx = ac(); if (!ctx) return;
  try {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square';
    o.frequency.value = 140 + 260 * intensity + Math.random() * 40;
    g.gain.setValueAtTime(0.06, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.1);
    const o2 = ctx.createOscillator(), g2 = ctx.createGain();
    o2.type = 'sine';
    o2.frequency.value = 70 + 60 * intensity;
    g2.gain.setValueAtTime(0.09, ctx.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);
    o2.connect(g2); g2.connect(ctx.destination);
    o2.start(); o2.stop(ctx.currentTime + 0.15);
  } catch (e) {}
};
function tick() {
  const ctx = ac(); if (!ctx) return;
  try {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.05, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.09);
  } catch (e) {}
}
function whoosh() {
  const ctx = ac(); if (!ctx) return;
  try {
    const len = Math.floor(ctx.sampleRate * 0.35);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.22, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    src.connect(f); f.connect(g); g.connect(ctx.destination);
    src.start();
  } catch (e) {}
}

/* ---------- countdown + dash flash ---------- */
const countText = document.getElementById('countText');
window.onCount = (txt) => {
  countText.textContent = txt;
  countText.classList.remove('pop');
  void countText.offsetWidth;
  countText.classList.add('pop');
  tick();
};

const dashFlash = document.getElementById('dashFlash');
window.onXtreme = () => {
  dashFlash.classList.remove('hidden');
  dashFlash.style.animation = 'none';
  void dashFlash.offsetWidth;
  dashFlash.style.animation = '';
  if (window.battleShake) window.battleShake(6);
};

window.onIntroDone = () => {
  countText.textContent = 'LET IT RIP!';
  countText.classList.remove('pop');
  void countText.offsetWidth;
  countText.classList.add('pop');
  whoosh();
  Battle.launch();
};

window.onMatchEnd = (result) => {
  R3D.celebrate(result.winner === 'player' ? 'p' : 'e', result.finish);
  if (result.finish === 'burst') whoosh();
  if (result.finish === 'over' || result.finish === 'xtreme') whoosh();
};

/* ---------- drawing canvas ---------- */
const drawCanvas = document.getElementById('drawCanvas');
const dctx = drawCanvas.getContext('2d');
dctx.lineWidth = 16;
dctx.lineCap = dctx.lineJoin = 'round';
dctx.strokeStyle = '#fff';
let drawing = false, last = null;

function pos(e) {
  const r = drawCanvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (drawCanvas.width / r.width),
    y: (e.clientY - r.top) * (drawCanvas.height / r.height),
  };
}
function dot(p) {
  dctx.beginPath();
  dctx.arc(p.x, p.y, 8, 0, 7);
  dctx.fillStyle = '#fff';
  dctx.fill();
}
drawCanvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  drawing = true;
  last = pos(e);
  dot(last);
  drawCanvas.setPointerCapture(e.pointerId);
  previewSoon();
});
drawCanvas.addEventListener('pointermove', (e) => {
  if (!drawing) return;
  e.preventDefault();
  const p = pos(e);
  dctx.beginPath();
  dctx.moveTo(last.x, last.y);
  dctx.lineTo(p.x, p.y);
  dctx.stroke();
  last = p;
  previewSoon();
});
const stopDraw = () => { drawing = false; };
drawCanvas.addEventListener('pointerup', stopDraw);
drawCanvas.addEventListener('pointercancel', stopDraw);
drawCanvas.addEventListener('contextmenu', (e) => e.preventDefault());

/* live stat preview */
const barHp  = document.getElementById('barHp');
const barAtk = document.getElementById('barAtk');
const barBal = document.getElementById('barBal');
function preview() {
  const s = analyzeBlade(drawCanvas);
  barHp.style.width  = s ? ((s.hp - 90) / 130) * 100 + '%' : '0%';
  barAtk.style.width = s ? ((s.atk - 6) / 46) * 100 + '%' : '0%';
  barBal.style.width = s ? s.bal * 100 + '%' : '0%';
}
let queued = false;
function previewSoon() {
  if (queued) return;
  queued = true;
  requestAnimationFrame(() => { queued = false; preview(); });
}

/* ---------- screens ---------- */
const modeScreen    = document.getElementById('modeScreen');
const drawScreen    = document.getElementById('drawScreen');
const battleScreen  = document.getElementById('battleScreen');
const resultOverlay = document.getElementById('resultOverlay');
const resultText    = document.getElementById('resultText');
const resultSub     = document.getElementById('resultSub');
const drawTitle     = document.getElementById('drawTitle');
const nameLeft      = document.getElementById('nameLeft');
const nameRight     = document.getElementById('nameRight');

function show(el) {
  modeScreen.classList.remove('active');
  drawScreen.classList.remove('active');
  battleScreen.classList.remove('active');
  el.classList.add('active');
}

/* ---------- game modes ---------- */
let mode = 'bot';
let whoseTurn = 1;
let busy = false;
const botCanvas = document.createElement('canvas');
botCanvas.width = botCanvas.height = 320;
let p1Canvas = null;
let lastP1Canvas = null, lastEnemyCanvas = null;
let lastP1Stats = null, lastEnemyStats = null;

const TYPE_ICON = { attack: '\u2694\uFE0F', defense: '\u{1F6E1}\uFE0F', stamina: '\u{1F300}', balance: '\u2696\uFE0F' };

function startMode(m) {
  mode = m;
  whoseTurn = 1;
  busy = false;
  drawTitle.textContent = m === 'friend' ? 'PLAYER 1 -- DRAW YOUR BLADE' : 'DRAW YOUR BLADE';
  dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  preview();
  show(drawScreen);
}

function fight() {
  if (busy) return;
  let pStats = analyzeBlade(drawCanvas);

  if (mode === 'friend' && whoseTurn === 1) {
    p1Canvas = cloneCanvas(drawCanvas);
    whoseTurn = 2;
    drawTitle.textContent = 'PLAYER 2 -- DRAW YOUR BLADE';
    dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    preview();
    return;
  }

  if (!pStats) {
    makeRandomBlade(drawCanvas);
    pStats = analyzeBlade(drawCanvas);
    preview();
  }

  let enemyCanvas, eStats;
  if (mode === 'friend') {
    enemyCanvas = cloneCanvas(drawCanvas);
    eStats = analyzeBlade(enemyCanvas);
  } else {
    makeRandomBlade(botCanvas);
    enemyCanvas = botCanvas;
    eStats = analyzeBlade(botCanvas);
  }

  lastP1Canvas = cloneCanvas(mode === 'friend' ? p1Canvas : drawCanvas);
  lastP1Stats = pStats;
  lastEnemyCanvas = cloneCanvas(enemyCanvas);
  lastEnemyStats = eStats;

  nameLeft.textContent  = (mode === 'friend' ? 'P1' : 'YOU') + ' ' + TYPE_ICON[Battle.personaOf(pStats)];
  nameRight.textContent = (mode === 'friend' ? 'P2' : 'BOT') + ' ' + TYPE_ICON[Battle.personaOf(eStats)];

  busy = true;
  resultOverlay.classList.add('hidden');
  countText.textContent = '';
  show(battleScreen);
  /* slight delay so the screen fade starts before the camera sweep */
  setTimeout(() => {
    Battle.start(lastP1Canvas, lastEnemyCanvas, lastP1Stats, lastEnemyStats, onBattleEnd);
    R3D.start(lastP1Canvas, lastEnemyCanvas, lastP1Stats, lastEnemyStats);
  }, 250);
}

const FINISH_TEXT = {
  burst:   'BURST FINISH!',
  spinout: 'SPIN FINISH!',
  over:    'OVER FINISH!',
  xtreme:  'XTREME FINISH!',
};

function onBattleEnd(result) {
  R3D.stop();
  busy = false;
  const youWon = result.winner === 'player';
  const draw = result.winner === 'draw';
  resultText.textContent = draw ? 'DRAW!' : FINISH_TEXT[result.finish] || 'FINISH!';
  resultText.style.color = youWon ? '#55efc4' : draw ? '#ffeaa7' : '#ff7675';

  let sub;
  if (mode === 'friend') {
    sub = draw ? 'Nobody wins this time'
      : result.winner === 'player' ? 'P1 WINS! Pass it back for revenge?' : 'P2 WINS! Pass it back for revenge?';
  } else {
    sub = draw ? 'Nobody wins this time'
      : youWon ? 'VICTORY -- 3-2-1, let it rip again!' : 'DEFEAT -- redraw and take revenge!';
  }
  resultSub.textContent = sub;
  resultOverlay.classList.remove('hidden');
}

/* ---------- buttons ---------- */
document.getElementById('btnVsBot').addEventListener('click', () => startMode('bot'));
document.getElementById('btnVsFriend').addEventListener('click', () => startMode('friend'));
document.getElementById('btnClear').addEventListener('click', () => {
  dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  preview();
});
document.getElementById('btnRandom').addEventListener('click', () => {
  makeRandomBlade(drawCanvas);
  preview();
});
document.getElementById('btnFight').addEventListener('click', fight);
document.getElementById('btnNewBlade').addEventListener('click', () => {
  if (mode === 'friend') {
    whoseTurn = 1;
    drawTitle.textContent = 'PLAYER 1 -- DRAW YOUR BLADE';
  }
  show(drawScreen);
});
document.getElementById('btnRematch').addEventListener('click', () => {
  if (busy) return;
  busy = true;
  resultOverlay.classList.add('hidden');
  countText.textContent = '';
  show(battleScreen);
  setTimeout(() => {
    Battle.start(lastP1Canvas, lastEnemyCanvas, lastP1Stats, lastEnemyStats, onBattleEnd);
    R3D.start(lastP1Canvas, lastEnemyCanvas, lastP1Stats, lastEnemyStats);
  }, 250);
});

/* ---------- boot ---------- */
preview();
