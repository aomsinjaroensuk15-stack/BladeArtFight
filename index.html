<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BladeArtFight</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  background: #dfe4ea;
  color: #2d3436;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

.screen {
  position: fixed; inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.screen.active { display: flex; }

#battleScreen {
  background:
    linear-gradient(#ccd3db 1px, transparent 1px),
    linear-gradient(90deg, #ccd3db 1px, transparent 1px),
    #dfe4ea;
  background-size: 44px 44px;
  justify-content: flex-start;
  padding-top: 8px;
}

h1 { font-size: 32px; letter-spacing: 3px; font-weight: 900; color: #0984e3; text-align: center; }
h1 span { color: #e17055; }
.tagline { font-size: 13px; color: #636e72; margin-top: -6px; }

/* ---------- mode select ---------- */
.modeBtn {
  width: min(78vw, 300px);
  border: none; border-radius: 16px;
  padding: 18px 20px; font-size: 17px; font-weight: 900;
  cursor: pointer; text-align: left;
  transition: transform .08s, box-shadow .08s;
  box-shadow: 0 5px 0 rgba(0,0,0,.18);
}
.modeBtn:active { transform: scale(.95); }
.modeBtn small { display: block; font-weight: 600; font-size: 11px; opacity: .85; margin-top: 3px; }
.modeBtn.bot    { background: linear-gradient(135deg,#0984e3,#74b9ff); color: #fff; }
.modeBtn.friend { background: linear-gradient(135deg,#e17055,#fab1a0); color: #fff; }

/* ---------- draw screen ---------- */
#drawTitle { font-size: 16px; font-weight: 900; color: #57606f; letter-spacing: 1px; }

#drawWrap {
  width: min(70vw, 320px); height: min(70vw, 320px);
  border-radius: 50%;
  background: #f5f7fa;
  box-shadow: 0 10px 30px rgba(45,52,54,.18), inset 0 0 0 3px #b2bec3;
  display: flex; align-items: center; justify-content: center;
}
#drawCanvas {
  width: 88%; height: 88%;
  border-radius: 50%;
  background:
    radial-gradient(circle, transparent 64%, rgba(9,132,227,.10) 65%, transparent 66%),
    radial-gradient(circle, transparent 31%, rgba(9,132,227,.10) 32%, transparent 33%);
  touch-action: none;
  cursor: crosshair;
}

#statPreview { width: min(80vw, 340px); display: flex; flex-direction: column; gap: 5px; }
.stat { display: grid; grid-template-columns: 42px 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; }
.stat label { grid-row: span 2; font-size: 11px; font-weight: 800; color: #636e72; }
.stat .hint { grid-column: 2; font-size: 10px; color: #98a0a6; }
.bar { height: 10px; background: #cdd3da; border-radius: 6px; overflow: hidden; }
.fillb { height: 100%; width: 0%; border-radius: 6px; transition: width .15s; background: linear-gradient(90deg,#0984e3,#74b9ff); }
#barAtk.fillb   { background: linear-gradient(90deg,#d63031,#ff7675); }
#barBal.fillb   { background: linear-gradient(90deg,#00b894,#55efc4); }

/* ---------- buttons ---------- */
.btnRow { display: flex; gap: 10px; }
.btn {
  border: none; border-radius: 12px;
  padding: 12px 20px; font-size: 15px; font-weight: 800;
  cursor: pointer; transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: scale(.94); }
.btn.primary { background: #0984e3; color: #fff; box-shadow: 0 4px 0 #0767b2; }
.btn.primary:active { box-shadow: 0 1px 0 #0767b2; }
.btn.ghost { background: #fff; color: #57606f; box-shadow: 0 4px 0 #b9c0c8; }
.btn.ghost:active { box-shadow: 0 1px 0 #b9c0c8; }

/* ---------- battle ---------- */
#hud {
  width: min(96vw, 480px);
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,.78);
  border-radius: 14px; padding: 9px 12px;
  box-shadow: 0 6px 18px rgba(45,52,54,.12);
  z-index: 5;
}
#vs { font-weight: 900; color: #b2bec3; font-size: 14px; }
.hpSide { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.hpSide.right { align-items: flex-end; }
.hpbar { width: 100%; height: 14px; background: #e3e7ec; border-radius: 8px; overflow: hidden; }
.fill { height: 100%; width: 100%; border-radius: 8px; transition: width .12s; }
.fill.blue   { background: linear-gradient(90deg,#0984e3,#74b9ff); }
.fill.orange { background: linear-gradient(90deg,#e17055,#fab1a0); }
.spinbar { width: 100%; height: 5px; background: #e3e7ec; border-radius: 4px; overflow: hidden; }
.spinbar div { height: 100%; width: 100%; background: #00cec9; transition: width .12s; }
.name { font-size: 10px; font-weight: 800; color: #636e72; letter-spacing: 1px; }

#arenaWrap {
  position: relative;
  line-height: 0;
  box-shadow: 0 24px 60px rgba(45,52,54,.35);
  z-index: 1;
}
#arenaWrap canvas { display: block; }

#dashFlash {
  position: fixed; left: 50%; top: 38%;
  transform: translate(-50%,-50%) rotate(-6deg);
  font-size: 44px; font-weight: 900; font-style: italic;
  letter-spacing: 2px; color: #00b894;
  text-shadow: 0 0 18px rgba(0,184,148,.8), 0 4px 0 #067a63, 3px 3px 0 #fff;
  pointer-events: none; z-index: 8;
  animation: dashPop .9s ease-out forwards;
}
#dashFlash.hidden { display: none; }
@keyframes dashPop {
  0%   { opacity: 0; transform: translate(-50%,-50%) rotate(-6deg) scale(.3); }
  25%  { opacity: 1; transform: translate(-50%,-50%) rotate(-6deg) scale(1.15); }
  70%  { opacity: 1; transform: translate(-50%,-50%) rotate(-6deg) scale(1); }
  100% { opacity: 0; transform: translate(-50%,-60%) rotate(-6deg) scale(1); }
}

#resultOverlay {
  position: absolute; inset: 0; z-index: 10;
  background: rgba(45,52,54,.55);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
  backdrop-filter: blur(2px);
}
#resultOverlay.hidden { display: none; }
#resultText {
  font-size: 42px; font-weight: 900; font-style: italic; letter-spacing: 3px;
  color: #fff; text-shadow: 0 6px 24px rgba(0,0,0,.45), 3px 3px 0 rgba(0,0,0,.25);
  transform: rotate(-3deg);
  text-align: center;
}
#resultSub { font-size: 18px; font-weight: 800; color: #ffeaa7; letter-spacing: 2px; margin-bottom: 12px; }

#glError {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  background: #2d3436; color: #fff; font-size: 15px;
  padding: 30px; text-align: center;
}
#glError.hidden { display: none; }
</style>
</head>
<body>

  <!-- ============ MODE SELECT ============ -->
  <section id="modeScreen" class="screen active">
    <h1>BLADE<span>ART</span>FIGHT</h1>
    <p class="tagline">Draw your blade. Ride the X-rail. Xtreme Dash.</p>
    <button id="btnVsBot" class="modeBtn bot">&#129302; VS BOT<small>Battle a procedurally-drawn rival blade</small></button>
    <button id="btnVsFriend" class="modeBtn friend">&#128101; VS FRIEND<small>Pass &amp; play: you both draw, then fight</small></button>
  </section>

  <!-- ============ DRAW SCREEN ============ -->
  <section id="drawScreen" class="screen">
    <h1>BLADE<span>ART</span>FIGHT</h1>
    <p id="drawTitle">DRAW YOUR BLADE</p>

    <div id="drawWrap">
      <canvas id="drawCanvas" width="320" height="320"></canvas>
    </div>

    <div id="statPreview">
      <div class="stat"><label>HP</label><div class="bar"><div id="barHp" class="fillb"></div></div><span class="hint">bigger drawing = tank</span></div>
      <div class="stat"><label>ATK</label><div class="bar"><div id="barAtk" class="fillb"></div></div><span class="hint">spiky edge = ouch</span></div>
      <div class="stat"><label>SPIN</label><div class="bar"><div id="barBal" class="fillb"></div></div><span class="hint">symmetric = spins long</span></div>
    </div>

    <div class="btnRow">
      <button id="btnClear"  class="btn ghost">Clear</button>
      <button id="btnRandom" class="btn ghost">&#127922; Random</button>
      <button id="btnFight"  class="btn primary">LET IT RIP!</button>
    </div>
  </section>

  <!-- ============ BATTLE SCREEN ============ -->
  <section id="battleScreen" class="screen">
    <div id="hud">
      <div class="hpSide">
        <div class="hpbar"><div id="hpPlayer" class="fill blue"></div></div>
        <div class="spinbar"><div id="spinPlayer"></div></div>
        <span class="name" id="nameLeft">YOU</span>
      </div>
      <div id="vs">VS</div>
      <div class="hpSide right">
        <div class="hpbar"><div id="hpEnemy" class="fill orange"></div></div>
        <div class="spinbar"><div id="spinEnemy"></div></div>
        <span class="name" id="nameRight">BOT</span>
      </div>
    </div>

    <div id="arenaWrap"></div>

    <div id="dashFlash" class="hidden">XTREME DASH!</div>

    <div id="resultOverlay" class="hidden">
      <h2 id="resultText"></h2>
      <p id="resultSub"></p>
      <div class="btnRow">
        <button id="btnRematch"   class="btn primary">Rematch</button>
        <button id="btnNewBlade"  class="btn ghost">New Blade</button>
      </div>
    </div>
  </section>

  <div id="glError" class="hidden">3D could not start on this device/browser (WebGL unavailable).<br>Try another browser like Chrome.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =========================================================
   BladeArtFight - single-file build
   stats -> battle (Matter.js 2D physics) -> render3d (Three.js)
   -> main glue. VS BOT and VS FRIEND (pass & play) modes.
   ========================================================= */

/* =================== 1. STATS: drawing -> build =================== */

function getMask(canvas) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const data = ctx.getImageData(0, 0, W, H).data;
  const mask = new Uint8Array(W * H);
  let count = 0;
  for (let i = 0; i < W * H; i++) {
    if (data[i * 4 + 3] > 40) { mask[i] = 1; count++; }
  }
  return { mask, count, W, H };
}

function analyzeBlade(canvas) {
  const { mask, count, W, H } = getMask(canvas);
  if (count < 30) return null;
  const cx = W / 2, cy = H / 2;

  let sx = 0, sy = 0;
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++)
      if (mask[y * W + x]) { sx += x; sy += y; }
  const mx = sx / count, my = sy / count;

  let maxR = 0;
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++)
      if (mask[y * W + x]) {
        const d = Math.hypot(x - cx, y - cy);
        if (d > maxR) maxR = d;
      }

  let per = 0;
  for (let y = 1; y < H - 1; y++)
    for (let x = 1; x < W - 1; x++)
      if (mask[y * W + x] &&
         (!mask[y * W + x - 1] || !mask[y * W + x + 1] ||
          !mask[(y - 1) * W + x] || !mask[(y + 1) * W + x])) per++;

  const roundness = (per * per) / (4 * Math.PI * count);
  const spikiness = Math.min(1, Math.max(0, roundness - 1) / 2.2);

  let overlap = 0;
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++)
      if (mask[y * W + x] && mask[y * W + (W - 1 - x)]) overlap++;
  const symmetry = overlap / count;

  const fill = Math.min(1, count / (0.28 * W * H));

  return {
    hp:     Math.round(90 + 130 * fill),
    atk:    Math.round(6 + 46 * spikiness),
    bal:    symmetry,
    r:      Math.max(26, Math.min(78, maxR)),
    wobble: Math.min(1, Math.hypot(mx - cx, my - cy) / (W * 0.3)),
    mx, my,
  };
}

function makeRandomBlade(canvas) {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff';
  ctx.lineCap = ctx.lineJoin = 'round';
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const kind = Math.floor(Math.random() * 3);

  if (kind === 0) {
    const spikes = 5 + Math.floor(Math.random() * 5);
    const R = 110 + Math.random() * 25;
    const r = R * (0.35 + Math.random() * 0.25);
    ctx.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const rad = i % 2 ? r : R;
      const a = (i * Math.PI) / spikes - Math.PI / 2;
      ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
    }
    ctx.closePath(); ctx.fill();
  } else if (kind === 1) {
    const n = 5 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const d = 68 + Math.random() * 30;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 22 + Math.random() * 14, 0, 7);
      ctx.fill();
    }
    ctx.beginPath(); ctx.arc(cx, cy, 30, 0, 7); ctx.fill();
  } else {
    const R = 100 + Math.random() * 25, n = 26;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * Math.PI * 2;
      const rad = R * (0.72 + Math.random() * 0.33);
      ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
    }
    ctx.closePath(); ctx.fill();
  }
}

function cloneCanvas(src) {
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  c.getContext('2d').drawImage(src, 0, 0);
  return c;
}

/* =================== 2. BATTLE: Matter.js physics =================== */

const Battle = (() => {
  const { Engine, Bodies, Body, Composite, Events, Vector } = Matter;

  const S = 1000;
  const WALL_T = 60;
  const RAIL_W = 62;
  const DASH_TICKS = 45;
  const EXIT_GAPS = [ [175, 265], [415, 585], [735, 825] ];
  const RAILS = [
    { ax: 70,  ay: 70,  bx: 930, by: 930 },
    { ax: 930, ay: 70,  bx: 70,  by: 930 },
  ];

  let engine = null, raf = null;
  let running = false, inited = false;
  let player = null, enemy = null;
  let pStats = null, eStats = null;
  let hp = { p: 0, e: 0 };
  let spin = { p: 1, e: 1 };
  let dash = { p: 0, e: 0 };
  let onEnd = null;

  const arenaSize = () =>
    Math.floor(Math.min(window.innerWidth - 8, window.innerHeight - 158));

  function buildWalls() {
    const opt = { isStatic: true, restitution: 0.6, render: { visible: false } };
    const walls = [
      Bodies.rectangle(S / 2, S + WALL_T / 2, S + 2 * WALL_T, WALL_T, opt),
      Bodies.rectangle(-WALL_T / 2, S / 2, WALL_T, S + 2 * WALL_T, opt),
      Bodies.rectangle(S + WALL_T / 2, S / 2, WALL_T, S + 2 * WALL_T, opt),
    ];
    let prev = 0;
    const spans = [];
    for (const [a, b] of EXIT_GAPS) { spans.push([prev, a]); prev = b; }
    spans.push([prev, S]);
    for (const [a, b] of spans)
      walls.push(Bodies.rectangle((a + b) / 2, -WALL_T / 2, b - a, WALL_T, opt));
    return walls;
  }

  function makeBlade(stats, x, y) {
    const b = Bodies.circle(x, y, stats.r, {
      label: 'blade', restitution: 0.55, friction: 0.02, frictionAir: 0.004,
    });
    b.plugin = { precess: Math.random() < 0.5 ? -1 : 1, precessCd: 60 + Math.random() * 120, nudge: 0, nudgeCd: 90 + Math.random() * 150, wobPh: Math.random() * 6 };
    return b;
  }

  function clampSpeed(b, max) {
    const v = b.velocity, s = Math.hypot(v.x, v.y);
    if (s > max) Body.setVelocity(b, { x: (v.x / s) * max, y: (v.y / s) * max });
  }

  function distToRails(p) {
    let best = null;
    for (const r of RAILS) {
      const abx = r.bx - r.ax, aby = r.by - r.ay;
      const L2 = abx * abx + aby * aby;
      let t = ((p.x - r.ax) * abx + (p.y - r.ay) * aby) / L2;
      t = Math.max(0, Math.min(1, t));
      const cx = r.ax + abx * t, cy = r.ay + aby * t;
      const d = Math.hypot(p.x - cx, p.y - cy);
      if (d < RAIL_W && (!best || d < best.d)) best = { d, cx, cy };
    }
    return best;
  }

  function handleRail(b, key) {
    if (spin[key] <= 0) return;
    const ri = distToRails(b.position);
    if (!ri) return;
    const dir = {
      x: Math.sign(S / 2 - b.position.x) || 1,
      y: Math.sign(S / 2 - b.position.y) || 1,
    };
    const n = Math.hypot(dir.x, dir.y);
    Body.applyForce(b, b.position, {
      x: (dir.x / n) * 0.30 * b.mass,
      y: (dir.y / n) * 0.30 * b.mass,
    });
    clampSpeed(b, 8.5);
    spin[key] = Math.min(1, spin[key] + 0.004);
    const L = Math.hypot(S / 2 - b.position.x, S / 2 - b.position.y);
    if (L < 150 && dash[key] <= 0) {
      dash[key] = DASH_TICKS;
      if (window.onXtreme) window.onXtreme(key);
    }
  }

  /* free beyblade movement: wide precessing orbits like a real top.
     no homing -- the tops drift, curve, and clash when paths cross.
     engagement comes from occasional attack nudges + the X-rail. */
  function freeMove(self, other, stats, key) {
    if (spin[key] <= 0) { clampSpeed(self, 0.4); return; }
    if (self.position.y < 0) return;          // escaping through an exit

    const v = self.velocity, s = Math.hypot(v.x, v.y);

    /* precession: constant gentle sideways push => circular orbits */
    if (s > 0.1) {
      const pf = 0.017 * self.mass * (0.3 + 0.7 * spin[key]);
      Body.applyForce(self, self.position, {
        x: (-v.y / s) * pf * self.plugin.precess,
        y: ( v.x / s) * pf * self.plugin.precess,
      });
    }
    if (--self.plugin.precessCd <= 0) {
      self.plugin.precess *= -1;
      self.plugin.precessCd = 110 + Math.random() * 170;
    }

    /* tiny random drift so no two orbits are the same */
    Body.applyForce(self, self.position, {
      x: (Math.random() - 0.5) * 0.010 * self.mass,
      y: (Math.random() - 0.5) * 0.010 * self.mass,
    });

    /* attack nudge: every few seconds, briefly curve toward the enemy */
    if (--self.plugin.nudgeCd <= 0) {
      const d = Vector.sub(other.position, self.position);
      if (Math.hypot(d.x, d.y) > 130) self.plugin.nudge = 26;
      self.plugin.nudgeCd = 130 + Math.random() * 190;
    }
    if (self.plugin.nudge > 0) {
      const d = Vector.sub(other.position, self.position);
      const dist = Math.hypot(d.x, d.y) || 1;
      Body.applyForce(self, self.position, { x: (d.x / dist) * 0.055 * self.mass, y: (d.y / dist) * 0.055 * self.mass });
      self.plugin.nudge--;
    }

    /* during an Xtreme Dash the top actively charges the opponent */
    if (dash[key] > 0) {
      const d = Vector.sub(other.position, self.position);
      const dist = Math.hypot(d.x, d.y) || 1;
      Body.applyForce(self, self.position, { x: (d.x / dist) * 0.10 * self.mass, y: (d.y / dist) * 0.10 * self.mass });
    }

    /* wobble: unbalanced blades drift sideways as they spin */
    if (stats.wobble > 0.05 && s > 0.1) {
      const t = engine.timing.timestamp * 0.012 + self.plugin.wobPh;
      const wf = Math.sin(t) * stats.wobble * 0.028 * self.mass;
      Body.applyForce(self, self.position, { x: (-v.y / s) * wf, y: (v.x / s) * wf });
    }

    /* a top slows down as its spin dies */
    clampSpeed(self, 5.4 * (0.25 + 0.75 * spin[key]) + (dash[key] > 0 ? 4.2 : 0));
  }

  function tick() {
    if (!running) return;
    handleRail(player, 'p');
    handleRail(enemy, 'e');
    freeMove(player, enemy, pStats, 'p');
    freeMove(enemy, player, eStats, 'e');

    dash.p = Math.max(0, dash.p - 1);
    dash.e = Math.max(0, dash.e - 1);

    spin.p = Math.max(0, spin.p - 0.00045 * (1.7 - pStats.bal) * (1 + pStats.wobble));
    spin.e = Math.max(0, spin.e - 0.00045 * (1.7 - eStats.bal) * (1 + eStats.wobble));
    Body.setAngularVelocity(player, -0.36 * spin.p);
    Body.setAngularVelocity(enemy,  0.36 * spin.e);

    Engine.update(engine, 1000 / 60);
    HUD.update(hp, spin);
    if (!checkEnd()) raf = requestAnimationFrame(tick);
  }

  function checkEnd() {
    for (const [b, key] of [[player, 'p'], [enemy, 'e']]) {
      if (b.position.y < -30) {
        const x = b.position.x;
        let finish = 'over';
        for (const [a, b2] of EXIT_GAPS)
          if (x >= a - 10 && x <= b2 + 10) finish = (b2 - a) > 150 ? 'xtreme' : 'over';
        return endMatch({ winner: key === 'p' ? 'bot' : 'player', finish });
      }
    }
    const pDead = hp.p <= 0, eDead = hp.e <= 0;
    const pOut = spin.p <= 0.02, eOut = spin.e <= 0.02;
    if ((pDead || pOut) && (eDead || eOut))
      return endMatch({ winner: hp.p > hp.e ? 'player' : hp.p < hp.e ? 'bot' : 'draw', finish: 'burst' });
    if (pDead) return endMatch({ winner: 'bot', finish: 'burst' });
    if (pOut)  return endMatch({ winner: 'bot', finish: 'spinout' });
    if (eDead) return endMatch({ winner: 'player', finish: 'burst' });
    if (eOut)  return endMatch({ winner: 'player', finish: 'spinout' });
    return null;
  }

  function endMatch(result) {
    running = false;
    if (raf) cancelAnimationFrame(raf);
    HUD.update(hp, spin);
    if (window.battleShake) window.battleShake(14);
    setTimeout(() => { cleanup(); if (onEnd) onEnd(result); }, 1100);
    return true;
  }

  function cleanup() {
    if (!inited) return;
    try {
      Events.off(engine);
      Composite.clear(engine.world, false);
      Engine.clear(engine);
    } catch (e) {}
    inited = false;
  }

  function onCollision(ev) {
    for (const pair of ev.pairs) {
      const a = pair.bodyA, b = pair.bodyB;
      if (a.label !== 'blade' || b.label !== 'blade') continue;
      const speed = Vector.magnitude(Vector.sub(a.velocity, b.velocity));
      if (speed < 2) continue;
      const aDash = (a === player ? dash.p : dash.e) > 0;
      const bDash = (b === player ? dash.p : dash.e) > 0;

      const dmgToA = Math.min(60, b.plugin.stats.atk * speed * 0.085 * (bDash ? 2.2 : 1));
      const dmgToB = Math.min(60, a.plugin.stats.atk * speed * 0.085 * (aDash ? 2.2 : 1));
      hp[a === player ? 'p' : 'e'] -= dmgToA;
      hp[b === player ? 'p' : 'e'] -= dmgToB;

      if (bDash) Body.setVelocity(a, { x: a.velocity.x + b.velocity.x * 0.9, y: a.velocity.y + b.velocity.y * 0.9 });
      if (aDash) Body.setVelocity(b, { x: b.velocity.x + a.velocity.x * 0.9, y: b.velocity.y + a.velocity.y * 0.9 });

      spin.p = Math.max(0, spin.p - speed * 0.012);
      spin.e = Math.max(0, spin.e - speed * 0.012);

      if (window.battleShake) window.battleShake(Math.min(10, speed));
      if (window.blip) window.blip(Math.min(1, speed / 8));
    }
  }

  function start(pCanvas, eCanvas, ps, es, endCb) {
    if (running) return;
    cleanup();
    onEnd = endCb;
    pStats = ps; eStats = es;
    hp = { p: ps.hp, e: es.hp };
    spin = { p: 1, e: 1 };
    dash = { p: 0, e: 0 };

    engine = Engine.create();
    engine.gravity.y = 0;

    player = makeBlade(ps, S / 2, S * 0.74);
    enemy  = makeBlade(es, S / 2, S * 0.26);
    Body.setVelocity(player, { x: -3.0, y: -1.6 });
    Body.setVelocity(enemy,  { x:  3.0, y: 1.6 });
    Composite.add(engine.world, [...buildWalls(), player, enemy]);

    Events.on(engine, 'collisionStart', onCollision);

    inited = true;
    running = true;
    HUD.setMaxes(ps.hp, es.hp);
    raf = requestAnimationFrame(tick);
  }

  function getState() {
    if (!inited) return { running: false };
    const bs = (b, key) => ({
      x: b.position.x, y: b.position.y, angle: b.angle,
      vx: b.velocity.x, vy: b.velocity.y,
      spin: spin[key], dash: dash[key] > 0, hp: hp[key],
    });
    return { running, player: bs(player, 'p'), enemy: bs(enemy, 'e') };
  }

  return { start, getState, arenaSize, S, EXIT_GAPS };
})();

/* =================== 3. RENDER: Three.js 3D =================== */

const R3D = (() => {
  if (!window.THREE) return { start() {}, stop() {} };

  const S = 1000;
  let renderer = null, scene = null, camera = null;
  let topP = null, topE = null;
  let pStats = null, eStats = null;
  let raf = null, running = false;
  let shake = 0, fovKick = 0;
  const BASE_FOV = 52;                        // wider fov = punchier 3D
  /* lower, more cinematic camera (more tilt = more depth visible) */
  const CAM_DIR = new THREE.Vector3(0, 0.66, 1.0).normalize();
  let camDist = 1500;

  function gridTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const x = c.getContext('2d');
    x.fillStyle = '#cfd6dd'; x.fillRect(0, 0, 256, 256);
    x.strokeStyle = '#b9c2cb'; x.lineWidth = 3;
    x.strokeRect(0, 0, 256, 256);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(18, 18);
    return t;
  }

  function artTexture(srcCanvas, color) {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const x = c.getContext('2d');
    x.beginPath(); x.arc(256, 256, 254, 0, 7); x.clip();
    x.drawImage(srcCanvas, 0, 0, 512, 512);
    x.globalCompositeOperation = 'source-in';
    x.fillStyle = color;
    x.fillRect(0, 0, 512, 512);
    x.globalCompositeOperation = 'source-over';
    x.strokeStyle = 'rgba(255,255,255,.9)';
    x.lineWidth = 12;
    x.beginPath(); x.arc(256, 256, 246, 0, 7); x.stroke();
    return new THREE.CanvasTexture(c);
  }

  function buildStadium() {
    const dish = new THREE.Group();

    const floor = new THREE.Mesh(
      new THREE.BoxGeometry(S, 24, S),
      new THREE.MeshStandardMaterial({ color: 0xeef1f5, roughness: 0.55, metalness: 0.05 })
    );
    floor.position.y = -12;
    floor.receiveShadow = true;
    dish.add(floor);

    for (const frac of [0.66, 0.33]) {
      const r = (S / 2) * frac;
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(r - 4, r, 72),
        new THREE.MeshBasicMaterial({ color: 0xc9d2db, side: THREE.DoubleSide })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.6;
      dish.add(ring);
    }
    const centre = new THREE.Mesh(
      new THREE.CircleGeometry(72, 48),
      new THREE.MeshBasicMaterial({ color: 0xe2e8ee })
    );
    centre.rotation.x = -Math.PI / 2;
    centre.position.y = 0.6;
    dish.add(centre);

    const wallMat = new THREE.MeshStandardMaterial({ color: 0xf7f9fb, roughness: 0.4, metalness: 0.05 });
    const mkWall = (w, x, z, rx, rz) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, 100, 30), wallMat);
      m.position.set(x, 42, z);
      m.rotation.x = rx; m.rotation.z = rz;
      m.castShadow = true; m.receiveShadow = true;
      dish.add(m);
    };
    mkWall(S + 120, 0, S / 2 - 6, -0.35, 0);
    mkWall(S + 120, -S / 2 + 6, 0, 0, 0.35);
    mkWall(S + 120,  S / 2 - 6, 0, 0, -0.35);
    let prev = 0;
    const spans = [];
    for (const [a, b] of Battle.EXIT_GAPS) { spans.push([prev, a]); prev = b; }
    spans.push([prev, S]);
    for (const [a, b] of spans)
      mkWall(b - a, (a + b) / 2 - S / 2, -S / 2 + 6, 0.35, 0);

    for (const [a, b] of Battle.EXIT_GAPS) {
      const wide = (b - a) > 150;
      const pad = new THREE.Mesh(
        new THREE.BoxGeometry(b - a, 3, 110),
        new THREE.MeshStandardMaterial({
          color: wide ? 0xff7675 : 0xfab1a0,
          roughness: 0.5, emissive: wide ? 0x661412 : 0x4d1d12, emissiveIntensity: 0.35,
        })
      );
      pad.position.set((a + b) / 2 - S / 2, 1, -S / 2 - 52);
      pad.receiveShadow = true;
      dish.add(pad);
    }

    const railMat = new THREE.MeshStandardMaterial({
      color: 0x00b894, roughness: 0.25, metalness: 0.35,
      emissive: 0x00b894, emissiveIntensity: 0.18,
    });
    for (const rot of [Math.PI / 4, -Math.PI / 4]) {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(S * 1.32, 9, 44), railMat);
      rail.position.y = 4;
      rail.rotation.y = rot;
      rail.receiveShadow = true;
      dish.add(rail);
    }

    scene.add(dish);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(7000, 7000),
      new THREE.MeshStandardMaterial({ map: gridTexture(), roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -25;
    ground.receiveShadow = true;
    scene.add(ground);
  }

  /* ---- silhouette tracing: the blade becomes the EXACT drawn shape ---- */

  function outlineLoops(canvas) {
    const { mask, W, H } = getMask(canvas);
    const edges = [];
    const adj = new Map();
    const key = (x, y) => x + ',' + y;
    function addEdge(x1, y1, x2, y2) {
      const idx = edges.length;
      edges.push([x1, y1, x2, y2]);
      for (const p of [[x1, y1], [x2, y2]]) {
        const k = key(p[0], p[1]);
        if (!adj.has(k)) adj.set(k, []);
        adj.get(k).push(idx);
      }
    }
    for (let y = 1; y < H - 1; y++)
      for (let x = 1; x < W - 1; x++) {
        if (!mask[y * W + x]) continue;
        if (!mask[(y - 1) * W + x]) addEdge(x, y, x + 1, y);
        if (!mask[(y + 1) * W + x]) addEdge(x, y + 1, x + 1, y + 1);
        if (!mask[y * W + x - 1]) addEdge(x, y, x, y + 1);
        if (!mask[y * W + x + 1]) addEdge(x + 1, y, x + 1, y + 1);
      }
    const used = new Set();
    const loops = [];
    for (let i = 0; i < edges.length; i++) {
      if (used.has(i)) continue;
      used.add(i);
      const pts = [[edges[i][0], edges[i][1]]];
      let cx = edges[i][2], cy = edges[i][3];
      pts.push([cx, cy]);
      let guard = 0;
      while (guard++ < 30000 && !(cx === pts[0][0] && cy === pts[0][1])) {
        const nexts = (adj.get(key(cx, cy)) || []).filter(j => !used.has(j));
        if (!nexts.length) break;
        const j = nexts[0];
        used.add(j);
        const e = edges[j];
        if (e[0] === cx && e[1] === cy) { cx = e[2]; cy = e[3]; }
        else { cx = e[0]; cy = e[1]; }
        pts.push([cx, cy]);
      }
      if (pts.length > 10) loops.push(simplify(pts));
    }
    return loops.filter(l => Math.abs(polyArea(l)) > 120);
  }

  function simplify(pts) {
    const out = [];
    const n = pts.length;
    for (let i = 0; i < n; i++) {
      const a = pts[(i - 1 + n) % n], b = pts[i], c = pts[(i + 1) % n];
      const cross = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
      if (Math.abs(cross) > 0.01) out.push(b);
    }
    return out.length >= 3 ? out : pts;
  }

  function polyArea(pts) {
    let a = 0;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length];
      a += p[0] * q[1] - q[0] * p[1];
    }
    return a / 2;
  }

  function pointIn(pt, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
      if (((yi > pt[1]) !== (yj > pt[1])) &&
          (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }

  /* build the top: the drawn silhouette(s) extruded into 3D,
     spinning around the ink's centre of mass */
  function buildTop(artCanvas, color, stats) {
    const g = new THREE.Group();

    const artTex = artTexture(artCanvas, color);
    artTex.wrapS = artTex.wrapT = THREE.RepeatWrapping;
    artTex.repeat.set(1 / 320, 1 / 320);   // cap UVs are raw canvas px
    artTex.flipY = false;
    artTex.anisotropy = 4;
    const capMat = new THREE.MeshStandardMaterial({ map: artTex, roughness: 0.35, metalness: 0.3 });
    const sideMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(color), roughness: 0.3, metalness: 0.45 });

    const spinGroup = new THREE.Group();
    const ox = (stats.mx || 160), oy = (stats.my || 160);

    const loops = outlineLoops(artCanvas)
      .map(pts => ({ pts, area: Math.abs(polyArea(pts)) }))
      .sort((a, b) => b.area - a.area);

    /* loops inside bigger loops become real holes (donut blades!) */
    const roots = [];
    for (const o of loops) {
      const host = loops.find(x => x !== o && x.area > o.area && pointIn(o.pts[0], x.pts));
      if (host) (host.holes = host.holes || []).push(o.pts);
      else roots.push(o);
    }

    for (const o of roots.slice(0, 12)) {
      const shape = new THREE.Shape(o.pts.map(p => new THREE.Vector2(p[0], p[1])));
      for (const h of (o.holes || []))
        shape.holes.push(new THREE.Path(h.slice().reverse().map(p => new THREE.Vector2(p[0], p[1]))));
      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: 20, bevelEnabled: true, bevelThickness: 8,
        bevelSize: 5, bevelSegments: 2, curveSegments: 3,
      });
      const mesh = new THREE.Mesh(geo, [capMat, sideMat]);
      mesh.castShadow = true;
      mesh.rotation.x = Math.PI / 2;         // lay flat; canvas y -> world z
      mesh.position.set(-ox, 46, -oy);       // spin around centre of mass
      spinGroup.add(mesh);
    }

    const ratchet = new THREE.Mesh(
      new THREE.CylinderGeometry(20, 23, 16, 32),
      new THREE.MeshStandardMaterial({ color: 0x2d3436, roughness: 0.5, metalness: 0.4 })
    );
    ratchet.position.y = 25;
    ratchet.castShadow = true;

    const tip = new THREE.Mesh(
      new THREE.ConeGeometry(12, 22, 24),
      new THREE.MeshStandardMaterial({ color: 0x8395a7, roughness: 0.25, metalness: 0.85 })
    );
    tip.rotation.x = Math.PI;
    tip.position.y = 9;

    g.add(spinGroup, ratchet, tip);
    g.userData = { spin: spinGroup, capMat, sideMat };
    return g;
  }

  function autoFit() {
    const corners = [
      new THREE.Vector3(-S / 2, 0, -S / 2), new THREE.Vector3(S / 2, 0, -S / 2),
      new THREE.Vector3(-S / 2, 0,  S / 2), new THREE.Vector3(S / 2, 0,  S / 2),
    ];
    camDist = 900;
    for (let i = 0; i < 50; i++) {
      camera.position.copy(CAM_DIR).multiplyScalar(camDist);
      camera.lookAt(0, 0, -30);
      camera.updateMatrixWorld();
      camera.updateProjectionMatrix();
      let maxAbs = 0;
      for (const c of corners) {
        const ndc = c.clone().project(camera);
        maxAbs = Math.max(maxAbs, Math.abs(ndc.x), Math.abs(ndc.y));
      }
      if (maxAbs < 0.97) break;
      camDist *= 1.06;
    }
  }

  function placeCamera(midX, midZ, t) {
    const m = Math.min(1, shake);
    const swayX = Math.sin(t * 0.00035) * 26;   // gentle living camera
    const swayZ = Math.cos(t * 0.00028) * 20;
    camera.position.set(
      CAM_DIR.x * camDist + midX * 0.12 + swayX + (Math.random() - 0.5) * m * 10,
      CAM_DIR.y * camDist + (Math.random() - 0.5) * m * 8,
      CAM_DIR.z * camDist + midZ * 0.10 + swayZ + (Math.random() - 0.5) * m * 10
    );
    camera.fov = BASE_FOV + fovKick;
    camera.updateProjectionMatrix();
    camera.lookAt(midX * 0.12, 0, -30 + midZ * 0.10);
    shake *= 0.88;
  }

  function placeTop(mesh, st, stats, dir, t) {
    if (!st) return;
    mesh.position.x = st.x - S / 2;
    mesh.position.z = st.y - S / 2;
    mesh.userData.spin.rotation.y += dir * st.spin * 2.2;

    mesh.rotation.x = Math.sin(t * 0.021) * stats.wobble * 0.22;
    mesh.rotation.z = Math.cos(t * 0.017) * stats.wobble * 0.22;

    const targetY = st.dash ? 34 + Math.sin(t * 0.02) * 6 : 0;
    mesh.position.y += (targetY - mesh.position.y) * 0.2;
    if (st.dash) {
      mesh.userData.capMat.emissive.setHex(0x2dffd8);
      mesh.userData.capMat.emissiveIntensity = 0.75;
    } else {
      mesh.userData.capMat.emissiveIntensity = 0;
    }
  }

  function loop() {
    if (!running) return;
    raf = requestAnimationFrame(loop);
    const st = Battle.getState();
    const t = performance.now();

    placeTop(topP, st.player, pStats, -1, t);
    placeTop(topE, st.enemy, eStats, 1, t);

    const anyDash = (st.player && st.player.dash) || (st.enemy && st.enemy.dash);
    fovKick += ((anyDash ? 9 : 0) - fovKick) * 0.12;

    const midX = st.player && st.enemy ? ((st.player.x + st.enemy.x) / 2 - S / 2) * 0.9 : 0;
    const midZ = st.player && st.enemy ? ((st.player.y + st.enemy.y) / 2 - S / 2) * 0.9 : 0;
    placeCamera(midX, midZ, t);

    renderer.render(scene, camera);
  }

  function initScene() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdfe4ea);
    scene.fog = new THREE.Fog(0xdfe4ea, 1600, 5200);

    camera = new THREE.PerspectiveCamera(BASE_FOV, 1, 10, 12000);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a97a5, 0.7));
    const sun = new THREE.DirectionalLight(0xffffff, 1.05);
    sun.position.set(500, 1100, 350);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -750; sun.shadow.camera.right = 750;
    sun.shadow.camera.top = 750;   sun.shadow.camera.bottom = -750;
    sun.shadow.camera.far = 3200;
    scene.add(sun);

    buildStadium();
  }

  function start(playerCanvas, enemyCanvas, ps, es) {
    pStats = ps; eStats = es;
    const wrap = document.getElementById('arenaWrap');
    wrap.innerHTML = '';

    const size = Battle.arenaSize();
    if (!renderer) {
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true });
      } catch (e) {
        document.getElementById('glError').classList.remove('hidden');
        return;
      }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      initScene();
    }
    if (topP) scene.remove(topP);
    if (topE) scene.remove(topE);
    topP = buildTop(playerCanvas, '#3b9dff', ps);
    topE = buildTop(enemyCanvas, '#ff6a3d', es);
    scene.add(topP, topE);

    renderer.setSize(size, size);
    camera.aspect = 1;
    wrap.style.width = size + 'px';
    wrap.style.height = size + 'px';
    wrap.appendChild(renderer.domElement);
    autoFit();

    running = true;
    shake = 0; fovKick = 0;
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }

  function stop() {
    running = false;
    if (raf) cancelAnimationFrame(raf);
  }

  window.battleShake = (v) => { shake = Math.min(1.4, shake + v * 0.09); };

  return { start, stop };
})();

/* =================== 4. MAIN: UI glue =================== */

const hpP = document.getElementById('hpPlayer');
const hpE = document.getElementById('hpEnemy');
const spP = document.getElementById('spinPlayer');
const spE = document.getElementById('spinEnemy');
let maxP = 1, maxE = 1;

window.HUD = {
  setMaxes(p, e) { maxP = p; maxE = e; this.update({ p, e }, { p: 1, e: 1 }); },
  update(hp, spin) {
    hpP.style.width = Math.max(0, Math.min(100, (hp.p / maxP) * 100)) + '%';
    hpE.style.width = Math.max(0, Math.min(100, (hp.e / maxE) * 100)) + '%';
    spP.style.width = Math.max(0, spin.p * 100) + '%';
    spE.style.width = Math.max(0, spin.e * 100) + '%';
  },
};

let AC = null;
window.blip = (intensity = 1) => {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square';
    o.frequency.value = 140 + 260 * intensity + Math.random() * 40;
    g.gain.setValueAtTime(0.06, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.09);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + 0.1);
  } catch (e) {}
};

const dashFlash = document.getElementById('dashFlash');
window.onXtreme = () => {
  dashFlash.classList.remove('hidden');
  dashFlash.style.animation = 'none';
  void dashFlash.offsetWidth;
  dashFlash.style.animation = '';
  if (window.battleShake) window.battleShake(6);
};

/* drawing canvas */
const drawCanvas = document.getElementById('drawCanvas');
const dctx = drawCanvas.getContext('2d');
dctx.lineWidth = 16;
dctx.lineCap = dctx.lineJoin = 'round';
dctx.strokeStyle = '#fff';
let drawing = false, last = null;

function pos(e) {
  const r = drawCanvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (drawCanvas.width / r.width),
    y: (e.clientY - r.top) * (drawCanvas.height / r.height),
  };
}
function dot(p) {
  dctx.beginPath();
  dctx.arc(p.x, p.y, 8, 0, 7);
  dctx.fillStyle = '#fff';
  dctx.fill();
}
drawCanvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  drawing = true;
  last = pos(e);
  dot(last);
  drawCanvas.setPointerCapture(e.pointerId);
  previewSoon();
});
drawCanvas.addEventListener('pointermove', (e) => {
  if (!drawing) return;
  e.preventDefault();
  const p = pos(e);
  dctx.beginPath();
  dctx.moveTo(last.x, last.y);
  dctx.lineTo(p.x, p.y);
  dctx.stroke();
  last = p;
  previewSoon();
});
const stopDraw = () => { drawing = false; };
drawCanvas.addEventListener('pointerup', stopDraw);
drawCanvas.addEventListener('pointercancel', stopDraw);

/* live stat preview */
const barHp  = document.getElementById('barHp');
const barAtk = document.getElementById('barAtk');
const barBal = document.getElementById('barBal');
function preview() {
  const s = analyzeBlade(drawCanvas);
  barHp.style.width  = s ? ((s.hp - 90) / 130) * 100 + '%' : '0%';
  barAtk.style.width = s ? ((s.atk - 6) / 46) * 100 + '%' : '0%';
  barBal.style.width = s ? s.bal * 100 + '%' : '0%';
}
let queued = false;
function previewSoon() {
  if (queued) return;
  queued = true;
  requestAnimationFrame(() => { queued = false; preview(); });
}

/* screens */
const modeScreen     = document.getElementById('modeScreen');
const drawScreen     = document.getElementById('drawScreen');
const battleScreen   = document.getElementById('battleScreen');
const resultOverlay  = document.getElementById('resultOverlay');
const resultText     = document.getElementById('resultText');
const resultSub      = document.getElementById('resultSub');
const drawTitle      = document.getElementById('drawTitle');
const nameLeft       = document.getElementById('nameLeft');
const nameRight      = document.getElementById('nameRight');

function show(el) {
  modeScreen.classList.remove('active');
  drawScreen.classList.remove('active');
  battleScreen.classList.remove('active');
  el.classList.add('active');
}

/* ---------- game modes ---------- */
let mode = 'bot';            // 'bot' | 'friend'
let whoseTurn = 1;           // friend mode: 1 or 2
const botCanvas = document.createElement('canvas');
botCanvas.width = botCanvas.height = 320;
let p1Canvas = null;         // stored P1 art in friend mode
let lastP1Canvas = null, lastEnemyCanvas = null;
let lastP1Stats = null, lastEnemyStats = null;

function startMode(m) {
  mode = m;
  whoseTurn = 1;
  drawTitle.textContent = m === 'friend' ? 'PLAYER 1 -- DRAW YOUR BLADE' : 'DRAW YOUR BLADE';
  dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  makeRandomBlade(drawCanvas);
  preview();
  show(drawScreen);
}

function fight() {
  let pStats = analyzeBlade(drawCanvas);

  if (mode === 'friend' && whoseTurn === 1) {
    /* hand the pen to player 2 */
    p1Canvas = cloneCanvas(drawCanvas);
    whoseTurn = 2;
    drawTitle.textContent = 'PLAYER 2 -- DRAW YOUR BLADE';
    dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    makeRandomBlade(drawCanvas);
    preview();
    return;
  }

  if (!pStats) {
    makeRandomBlade(drawCanvas);
    pStats = analyzeBlade(drawCanvas);
    preview();
  }

  let enemyCanvas, eStats;
  if (mode === 'friend') {
    enemyCanvas = cloneCanvas(drawCanvas);      // P2's art
    eStats = analyzeBlade(enemyCanvas);
  } else {
    makeRandomBlade(botCanvas);
    enemyCanvas = botCanvas;
    eStats = analyzeBlade(botCanvas);
  }

  lastP1Canvas = (mode === 'friend') ? cloneCanvas(p1Canvas) : cloneCanvas(drawCanvas);
  lastP1Stats = pStats;
  lastEnemyCanvas = cloneCanvas(enemyCanvas);
  lastEnemyStats = eStats;

  nameLeft.textContent  = mode === 'friend' ? 'P1' : 'YOU';
  nameRight.textContent = mode === 'friend' ? 'P2' : 'BOT';

  resultOverlay.classList.add('hidden');
  show(battleScreen);
  Battle.start(lastP1Canvas, lastEnemyCanvas, pStats, eStats, onBattleEnd);
  R3D.start(lastP1Canvas, lastEnemyCanvas, pStats, eStats);
}

const FINISH_TEXT = {
  burst:   'BURST FINISH!',
  spinout: 'SPIN FINISH!',
  over:    'OVER FINISH!',
  xtreme:  'XTREME FINISH!',
};

function onBattleEnd(result) {
  R3D.stop();
  const youWon = result.winner === 'player';
  const draw = result.winner === 'draw';
  resultText.textContent = draw ? 'DRAW!' : FINISH_TEXT[result.finish] || 'FINISH!';
  resultText.style.color = youWon ? '#55efc4' : draw ? '#ffeaa7' : '#ff7675';

  let sub;
  if (mode === 'friend') {
    sub = draw ? 'Nobody wins this time'
      : result.winner === 'player' ? 'P1 WINS! Pass it back for revenge?' : 'P2 WINS! Pass it back for revenge?';
  } else {
    sub = draw ? 'Nobody wins this time'
      : youWon ? 'VICTORY -- 3-2-1, let it rip again!' : 'DEFEAT -- redraw and take revenge!';
  }
  resultSub.textContent = sub;
  resultOverlay.classList.remove('hidden');
}

/* buttons */
document.getElementById('btnVsBot').addEventListener('click', () => startMode('bot'));
document.getElementById('btnVsFriend').addEventListener('click', () => startMode('friend'));
document.getElementById('btnClear').addEventListener('click', () => {
  dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  preview();
});
document.getElementById('btnRandom').addEventListener('click', () => {
  makeRandomBlade(drawCanvas);
  preview();
});
document.getElementById('btnFight').addEventListener('click', fight);
document.getElementById('btnNewBlade').addEventListener('click', () => {
  if (mode === 'friend') {
    whoseTurn = 1;
    drawTitle.textContent = 'PLAYER 1 -- DRAW YOUR BLADE';
  }
  show(drawScreen);
});
document.getElementById('btnRematch').addEventListener('click', () => {
  resultOverlay.classList.add('hidden');
  Battle.start(lastP1Canvas, lastEnemyCanvas, lastP1Stats, lastEnemyStats, onBattleEnd);
  R3D.start(lastP1Canvas, lastEnemyCanvas, lastP1Stats, lastEnemyStats);
});

/* boot */
makeRandomBlade(drawCanvas);
preview();
</script>
</body>
</html>
